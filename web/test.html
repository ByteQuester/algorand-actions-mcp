
<!DOCTYPE html>
<html>
<head>
  <title>MCP Test</title>
  <script src="https://unpkg.com/@modelcontextprotocol/sdk@1.17.5/dist/mcp.js"></script>
</head>
<body>
  <h1>MCP Test</h1>
  <script>
    const REMOTE_MCP_URL = 'https://algorand-remote-mcp.mehrdad-touraji.workers.dev/sse';
    const mcp = new MCP.MCP(REMOTE_MCP_URL);

    mcp.on('open', () => {
      console.log('Connection established.');
      mcp.request({
        method: 'tools/list',
        params: {},
      });
    });

    mcp.on('message', (message) => {
      console.log('Received message:', message);
    });

    mcp.on('error', (error) => {
      console.error('MCP Error:', error);
    });

    mcp.on('close', () => {
      console.log('Connection closed.');
    });
  </script>
</body>
</html>
