# Collateral Requirements Engine Configuration

# MCP Service URLs
mcp_services:
  algorand_reader_url: "http://localhost:8002"
  market_data_url: "http://localhost:8003"

# Base collateral ratios by asset type
base_collateral_ratios:
  algo_native: 1.50      # 150% - highly liquid
  stablecoin: 1.10       # 110% - low volatility
  asa_token: 2.00        # 200% - variable liquidity
  governance_token: 2.50 # 250% - higher risk
  lp_token: 3.00         # 300% - complex risk
  liquid_staking: 1.75   # 175% - moderate risk

# Risk adjustment factors
volatility_adjustments:
  low: 1.0      # < 20% volatility
  medium: 1.15  # 20-40% volatility
  high: 1.30    # 40-60% volatility
  extreme: 1.50 # > 60% volatility

liquidity_adjustments:
  high: 1.0     # > $1M daily volume
  medium: 1.10  # $100K - $1M daily volume
  low: 1.25     # < $100K daily volume

# Market conditions adjustments
market_conditions_adjustments:
  bull: 0.9
  normal: 1.0
  bear: 1.15
  volatile: 1.25

# Liquidation scenario parameters
liquidation_scenarios:
  price_drops: [0.1, 0.2, 0.3, 0.5]  # 10%, 20%, 30%, 50%
  scenario_names: ["Minor Correction", "Market Dip", "Bear Market", "Black Swan"]
  base_slippage: 0.05  # 5% base slippage
  gas_costs_usd: 50    # Estimated Algorand transaction costs

# Fallback asset prices (USD)
fallback_prices:
  USDC: 1.00
  USDT: 1.00
  goBTC: 45000.0
  goETH: 3000.0
  ALGO: 0.25

# Volatility estimates for common assets
volatility_estimates:
  ALGO:
    volatility_30d: 0.45
    volatility_7d: 0.35
    max_drawdown_30d: 0.25
    value_at_risk_95: 0.15
  USDC:
    volatility_30d: 0.02
    volatility_7d: 0.01
    max_drawdown_30d: 0.01
    value_at_risk_95: 0.005
  default:
    volatility_30d: 0.60
    volatility_7d: 0.50
    max_drawdown_30d: 0.40
    value_at_risk_95: 0.25

# Liquidity estimates for common assets
liquidity_estimates:
  ALGO:
    daily_volume_usd: 50000000
    market_cap_usd: 2000000000
    liquidity_tier: "high"
  USDC:
    daily_volume_usd: 5000000
    market_cap_usd: 500000000
    liquidity_tier: "high"
  default:
    daily_volume_usd: 100000
    market_cap_usd: 10000000
    liquidity_tier: "medium"

# Asset type classification
asset_classification:
  stablecoins: ["USDC", "USDT", "STBL"]
  lp_patterns: ["LP", "POOL"]
  governance_patterns: ["VOTE", "GOV", "DAO"]
  liquid_staking_patterns: ["STAKE", "LIQUID"]

# Risk assessment thresholds
risk_thresholds:
  low_volatility: 0.3
  high_diversification: 0.5
  adequate_collateral_ratio: 0.8
  marginal_collateral_ratio: 0.6

# Analysis parameters
analysis:
  default_confidence_score: 0.8
  data_quality_score: 0.85
  safety_buffer: 0.1  # 10% safety buffer on final ratio
  max_position_concentration: 0.7
  diversification_bonus_factor: 0.1
  cache_expiry_minutes: 5

# Database configuration
database:
  default_path: "notebooks/collateral_analysis.db"
  max_history_limit: 100