[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-collateral-analyzer"
version = "1.0.0"
description = "Comprehensive digital collateral analysis for DeFi lending on Algorand"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Algorand Lending Ecosystem", email = "info@algorand-lending.dev"}
]
maintainers = [
    {name = "Algorand Lending Ecosystem", email = "info@algorand-lending.dev"}
]
keywords = [
    "algorand", "defi", "collateral", "blockchain", "cryptocurrency",
    "lending", "risk-assessment", "valuation", "liquidation", "oracle",
    "portfolio", "volatility", "financial-analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "scipy>=1.9.0",
    "asyncio-mqtt>=0.11.0",
    "websockets>=10.0",
    "python-dateutil>=2.8.0",
    "typing-extensions>=4.0.0",
    "dataclasses-json>=0.5.7",
    "pydantic>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
    "jupyter>=1.0.0",
    "notebook>=6.5.0",
    "ipykernel>=6.15.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "notebook>=6.5.0",
    "ipykernel>=6.15.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.10.0",
]
oracle = [
    "chainlink-feeds>=1.0.0",
    "pycoingecko>=3.1.0",
]
mcp = [
    "mcp>=1.0.0",
    "sse-starlette>=1.6.0",
]

[project.scripts]
collateral-analyzer = "cli.main:main"
asset-valuation = "cli.asset_valuation:main"
volatility-assessment = "cli.volatility_assessment:main"
liquidation-scenarios = "cli.liquidation_scenarios:main"
oracle-integration = "cli.oracle_integration:main"
portfolio-analysis = "cli.portfolio_analysis:main"
collateral-requirements = "cli.collateral_requirements:main"

[project.urls]
homepage = "https://github.com/algorand-lending-ecosystem/blockchain-collateral-analyzer"
documentation = "https://algorand-lending-ecosystem.readthedocs.io/"
repository = "https://github.com/algorand-lending-ecosystem/blockchain-collateral-analyzer"
changelog = "https://github.com/algorand-lending-ecosystem/blockchain-collateral-analyzer/blob/main/CHANGELOG.md"
"Bug Reports" = "https://github.com/algorand-lending-ecosystem/blockchain-collateral-analyzer/issues"
"Funding" = "https://github.com/sponsors/algorand-lending-ecosystem"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "notebooks", "learning-path", "integration_tests"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.toml", "*.cfg", "*.ini", "*.md", "*.txt"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | notebooks
  | learning-path
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["blockchain_collateral_analyzer"]
skip_glob = ["**/migrations/*"]

# MyPy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "scipy.*",
    "matplotlib.*",
    "seaborn.*",
    "plotly.*",
    "chainlink_feeds.*",
    "pycoingecko.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
    "integration_tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "oracle: marks tests that require oracle data",
    "network: marks tests that require network connectivity",
]

# Coverage configuration
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "*/notebooks/*",
    "*/learning-path/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]