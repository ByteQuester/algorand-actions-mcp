# Volatility Assessment Engine Configuration

# MCP Service URLs
mcp_services:
  algorand_reader_url: "http://localhost:8002"
  market_data_url: "http://localhost:8003"

# Price staleness scoring parameters (from _calculate_staleness_score function)
price_staleness:
  scoring_thresholds:
    fresh: 30                         # <30 seconds = 1.0 score
    good: 300                         # <5 minutes = 0.9 score
    acceptable: 900                   # <15 minutes = 0.7 score
    stale: 3600                       # <1 hour = 0.5 score
    very_stale: 7200                  # >1 hour declining to 0 over 2 hours

  scoring_values:
    fresh: 1.0
    good: 0.9
    acceptable: 0.7
    stale: 0.5
    decline_rate: 0.000069444         # (0.5 / 7200) decline per second after 1 hour

# Volatility calculation parameters (from detect_price_manipulation function)
volatility_calculation:
  lookback_periods:
    short_term_minutes: 60            # 1 hour lookback for manipulation detection
    medium_term_hours: 24             # 24 hours for daily volatility
    long_term_days: 7                 # 7 days for weekly volatility assessment

  windows:
    manipulation_detection: 60        # Minutes for price manipulation analysis
    volatility_7d: 7                  # 7-day volatility window
    volatility_30d: 30                # 30-day volatility window

  minimum_data_points: 5              # Minimum price feeds required for analysis

# Price manipulation detection thresholds
manipulation_detection:
  risk_thresholds:
    volatility_high: 0.10             # >10% volatility triggers high risk
    price_range_suspicious: 0.20      # >20% price range triggers alert
    consensus_poor: 0.80              # <80% oracle consensus triggers alert
    insufficient_oracles: 2           # <2 oracles triggers alert

  risk_scoring:
    volatility_weight: 0.3            # Weight for volatility in risk score
    price_range_weight: 0.4           # Weight for price swings in risk score
    consensus_weight: 0.3             # Weight for oracle consensus in risk score
    oracle_coverage_weight: 0.2       # Weight for oracle coverage in risk score

  risk_levels:
    minimal_threshold: 0.2            # <0.2 = minimal risk
    low_threshold: 0.4                # 0.2-0.4 = low risk
    medium_threshold: 0.7             # 0.4-0.7 = medium risk
    high_threshold: 0.7               # >0.7 = high risk

# Oracle confidence and reliability parameters
oracle_confidence:
  minimum_confidence: 0.8             # Minimum confidence threshold for reliable prices
  confidence_penalty_single: 0.8     # Reduce confidence by 20% for single oracle
  consensus_strength_single: 0.5     # Lower consensus strength for single oracle

  reliability_weights:
    consensus_weight: 0.4             # Weight of consensus in final confidence
    staleness_weight: 0.3             # Weight of data freshness
    reliability_weight: 0.3           # Weight of historical reliability

  outlier_detection:
    max_deviation_multiplier: 10      # Consensus strength = 1 - (max_deviation * 10)
    weighted_median_enabled: true     # Use weighted median for consensus price

# Market analysis parameters
market_analysis:
  asset_categories:
    highly_liquid: ["ALGO", "USDC", "USDT", "BTC", "ETH"]
    liquid: ["AVAX", "SOL", "MATIC"]
    illiquid: ["GARD", "STBL"]

  volume_analysis:
    daily_volume_thresholds:
      high: 1000000                   # >$1M daily volume = high liquidity
      medium: 100000                  # $100K-$1M = medium liquidity
      low: 10000                      # <$100K = low liquidity

  correlation_analysis:
    correlation_window_days: 30       # 30-day correlation window
    correlation_threshold: 0.8        # >80% correlation = highly correlated

# Alert and monitoring thresholds
monitoring:
  alert_thresholds:
    volatility_spike: 2.0             # 2x normal volatility triggers alert
    price_deviation: 0.15             # 15% price deviation triggers alert
    oracle_failure_count: 2           # 2+ oracle failures triggers alert
    staleness_critical: 7200          # >2 hours = critical staleness

  escalation_levels:
    warning: 0.3                      # 30% risk score = warning
    critical: 0.6                     # 60% risk score = critical
    emergency: 0.8                    # 80% risk score = emergency

# Cache and performance settings
performance:
  cache_settings:
    price_cache_seconds: 30           # Cache prices for 30 seconds
    volatility_cache_minutes: 5       # Cache volatility calculations for 5 minutes
    oracle_status_cache_seconds: 60   # Cache oracle status for 1 minute

  rate_limiting:
    max_requests_per_second: 10       # Limit oracle API requests
    timeout_seconds: 30               # Timeout for oracle requests

  batch_processing:
    max_batch_size: 50                # Maximum assets per batch request
    parallel_requests: 5              # Number of parallel oracle requests

# Database and storage configuration
storage:
  price_history:
    retention_days: 30                # Keep 30 days of price history
    cleanup_interval_hours: 24        # Clean up old data every 24 hours
    max_records_per_asset: 10000      # Maximum price records per asset

  volatility_metrics:
    retention_days: 90                # Keep 90 days of volatility metrics
    calculation_interval_minutes: 15  # Recalculate volatility every 15 minutes

# Analysis and reporting
analysis:
  default_confidence_score: 0.8
  data_quality_score: 0.85
  simulation_iterations: 1000         # Monte Carlo simulation iterations
  stress_test_scenarios: 5            # Number of stress test scenarios
  cache_expiry_minutes: 3             # 3-minute cache for real-time data

# Database configuration
database:
  default_path: "notebooks/volatility_analysis.db"
  max_history_limit: 1000
  backup_enabled: true
  backup_interval_hours: 6