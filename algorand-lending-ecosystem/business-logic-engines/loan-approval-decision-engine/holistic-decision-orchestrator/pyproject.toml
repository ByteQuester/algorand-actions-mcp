[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algorand-holistic-decision-orchestrator"
version = "1.0.0"
description = "Holistic loan approval decision orchestrator for Algorand ecosystem"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Algorand Lending Team", email = "lending@algorand.com"}
]
maintainers = [
    {name = "Algorand Lending Team", email = "lending@algorand.com"}
]
keywords = [
    "algorand", "blockchain", "defi", "lending", "loan-approval",
    "risk-assessment", "governance", "collateral", "ecosystem",
    "holistic-analysis", "decision-engine", "fintech"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Framework :: AsyncIO",
]
requires-python = ">=3.9"
dependencies = [
    "asyncio",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "python-dateutil>=2.8.0",
    "typing-extensions>=4.0.0",
    "dataclasses-json>=0.5.0",
    "py-algorand-sdk>=2.0.0",
    "algosdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "isort>=5.12.0",
    "bandit>=1.7.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "httpx>=0.24.0",
    "respx>=0.20.0",
    "coverage>=7.0.0",
]
monitoring = [
    "prometheus-client>=0.16.0",
    "grafana-api>=1.0.3",
    "datadog>=0.44.0",
    "structlog>=23.0.0",
]
performance = [
    "uvloop>=0.17.0",
    "orjson>=3.8.0",
    "msgpack>=1.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
    "sphinx-autodoc-typehints>=1.22.0",
]

[project.urls]
Homepage = "https://github.com/algorand/lending-ecosystem"
Documentation = "https://algorand-lending-docs.readthedocs.io/"
Repository = "https://github.com/algorand/lending-ecosystem"
"Bug Tracker" = "https://github.com/algorand/lending-ecosystem/issues"
Changelog = "https://github.com/algorand/lending-ecosystem/blob/main/CHANGELOG.md"
Funding = "https://github.com/sponsors/algorand"

[project.scripts]
holistic-loan-approver = "cli.holistic_loan_approver:cli"
ecosystem-analyzer = "cli.ecosystem_analyzer:cli"
defi-behavior-checker = "cli.defi_behavior_checker:cli"
collateral-intelligence = "cli.collateral_intelligence:cli"
governance-reputation = "cli.governance_reputation:cli"
network-risk-monitor = "cli.network_risk_monitor:cli"

# Tool configurations

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "cli*", "integration_tests*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

# Black code formatting
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort import sorting
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["core", "cli", "integration_tests"]
known_third_party = ["algorand", "click", "pytest", "httpx", "pydantic"]

# MyPy type checking
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "algosdk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "py_algorand_sdk.*"
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "integration_tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "real_network: marks tests that require real Algorand network access",
    "mcp_services: marks tests that require MCP services running",
]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Coverage configuration
[tool.coverage.run]
source = ["core", "cli"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# Bandit security linting
[tool.bandit]
exclude_dirs = ["tests", "integration_tests"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection for tests

# Flake8 configuration (in setup.cfg since flake8 doesn't support pyproject.toml yet)
# [tool.flake8] - This would go in setup.cfg