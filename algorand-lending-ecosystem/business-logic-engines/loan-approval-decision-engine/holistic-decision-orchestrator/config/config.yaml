# Holistic Decision Orchestrator Configuration
# Master configuration for Algorand-native loan approval system

orchestrator:
  name: "Algorand Holistic Loan Approval System"
  version: "1.0.0"
  environment: "production"

# Engine Weights for Holistic Decision Making
engine_weights:
  ecosystem_analysis: 0.30      # Algorand ecosystem participation
  defi_behavior: 0.25          # DeFi protocol behavior patterns
  collateral_intelligence: 0.20 # Smart collateral analysis
  governance_reputation: 0.15   # Community governance participation
  network_risk_monitoring: 0.10 # Real-time network risk assessment

# Approval Thresholds
approval_thresholds:
  excellent: 0.85   # Auto-approve with premium terms
  good: 0.70       # Approve with standard terms
  fair: 0.55       # Approve with conservative terms
  poor: 0.40       # Conditional approval with strict terms
  reject: 0.39     # Reject but offer alternatives

# Confidence Score Requirements
confidence_requirements:
  minimum_confidence: 0.75
  high_confidence: 0.90
  data_completeness_threshold: 0.80

# Loan Conditions Framework
loan_conditions:
  ltv_ratios:
    excellent: 0.80
    good: 0.70
    fair: 0.60
    poor: 0.50

  interest_rate_adjustments:
    excellent: -0.005  # 0.5% discount
    good: 0.000       # Base rate
    fair: 0.010       # 1% premium
    poor: 0.025       # 2.5% premium

  monitoring_frequency:
    excellent: "weekly"
    good: "daily"
    fair: "daily"
    poor: "real-time"

# Alternative Loan Terms
alternative_terms:
  enable_alternatives: true
  max_alternatives: 3
  adjustment_strategies:
    - "lower_loan_amount"
    - "additional_collateral"
    - "co_signer_requirement"
    - "shorter_term"
    - "higher_interest_rate"

# Algorand Network Configuration
algorand:
  network: "mainnet"  # mainnet, testnet, betanet
  indexer_url: "https://mainnet-idx.algonode.cloud"
  algod_url: "https://mainnet-api.algonode.cloud"

  # MCP Services Integration
  mcp_services:
    reader_port: 8002
    writer_port: 8003
    timeout: 30

# Data Sources
data_sources:
  governance:
    api_endpoint: "https://governance.algorand.foundation/api"
    timeout: 15
    cache_duration: 300

  defi_protocols:
    - name: "Tinyman"
      api_endpoint: "https://mainnet.analytics.tinyman.org"
    - name: "Pact"
      api_endpoint: "https://api.pact.fi"
    - name: "AlgoFi"
      api_endpoint: "https://api.algofi.org"

  price_feeds:
    coingecko_api: "https://api.coingecko.com/api/v3"
    cache_duration: 60

# Risk Management
risk_management:
  max_loan_amount: 1000000  # ALGO
  min_collateral_ratio: 1.5
  max_ltv: 0.80

  blacklist_check: true
  sanctions_screening: true

  concentration_limits:
    single_borrower: 0.05      # 5% of total pool
    single_asset: 0.20         # 20% of collateral pool

# Monitoring and Alerts
monitoring:
  enable_real_time: true
  alert_thresholds:
    ltv_warning: 0.75
    ltv_liquidation: 0.85
    price_volatility: 0.20     # 20% price change

  notification_channels:
    - "webhook"
    - "email"
    - "slack"

# Performance Optimization
performance:
  cache_enabled: true
  cache_ttl: 300
  max_concurrent_requests: 50
  request_timeout: 30

  batch_processing:
    enabled: true
    batch_size: 100
    max_wait_time: 5

# Logging and Audit
logging:
  level: "INFO"
  format: "json"
  include_sensitive_data: false

  audit_trail:
    enabled: true
    retention_days: 2555  # 7 years
    include_decision_rationale: true

# Integration Settings
integrations:
  blockchain_collateral_analyzer:
    enabled: true
    endpoint: "http://localhost:8001/api/v1"

  interest_rate_determiner:
    enabled: true
    endpoint: "http://localhost:8004/api/v1"

  risk_assessment_calculator:
    enabled: true
    endpoint: "http://localhost:8005/api/v1"

# Machine Learning Models
ml_models:
  ecosystem_scoring:
    model_path: "models/ecosystem_scorer_v1.pkl"
    update_frequency: "weekly"

  behavior_prediction:
    model_path: "models/behavior_predictor_v1.pkl"
    update_frequency: "daily"

  risk_assessment:
    model_path: "models/risk_assessor_v1.pkl"
    update_frequency: "daily"