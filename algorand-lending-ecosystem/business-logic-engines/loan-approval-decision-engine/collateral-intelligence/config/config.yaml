# Collateral Intelligence Engine Configuration

# MCP Service URLs
mcp_services:
  algorand_reader_url: "http://localhost:8002"
  market_data_url: "http://localhost:8003"

# Integration with existing engines
integration:
  blockchain_collateral_analyzer: true
  base_analyzer_path: "../../../blockchain-collateral-analyzer"
  shared_models: true

# Smart Collateral Analysis Parameters
smart_collateral:
  analysis_depth: "comprehensive"  # basic, standard, comprehensive
  real_time_updates: true
  predictive_modeling: true
  stress_testing: true

  # Quality scoring weights
  quality_weights:
    liquidity: 0.25
    volatility: 0.20
    market_cap: 0.15
    governance_risk: 0.10
    technical_risk: 0.10
    correlation_risk: 0.10
    regulatory_risk: 0.10

# Liquidation Prediction Parameters
liquidation_prediction:
  ml_models:
    primary_model: "gradient_boosting"
    fallback_model: "random_forest"
    ensemble_voting: true

  prediction_horizons:
    short_term: 7    # days
    medium_term: 30  # days
    long_term: 90    # days

  risk_thresholds:
    very_low: 0.05    # 5% liquidation probability
    low: 0.15         # 15% liquidation probability
    medium: 0.30      # 30% liquidation probability
    high: 0.50        # 50% liquidation probability
    very_high: 0.75   # 75% liquidation probability

  model_features:
    price_features: 25
    volume_features: 15
    volatility_features: 20
    correlation_features: 10
    macro_features: 10

# Portfolio Correlation Analysis
portfolio_correlation:
  correlation_windows:
    short_term: 30   # days
    medium_term: 90  # days
    long_term: 365   # days

  correlation_thresholds:
    low: 0.3
    medium: 0.6
    high: 0.8
    very_high: 0.9

  diversification_metrics:
    herfindahl_index: true
    concentration_ratio: true
    effective_assets: true
    risk_parity_deviation: true

# Market Impact Analysis
market_impact:
  liquidity_tiers:
    tier_1: 10000000   # $10M+ daily volume
    tier_2: 1000000    # $1M+ daily volume
    tier_3: 100000     # $100K+ daily volume
    tier_4: 10000      # $10K+ daily volume

  impact_models:
    linear_impact: true
    square_root_impact: true
    algorithmic_impact: true

  slippage_estimates:
    tier_1: 0.001      # 0.1% for large cap
    tier_2: 0.005      # 0.5% for mid cap
    tier_3: 0.02       # 2% for small cap
    tier_4: 0.05       # 5% for micro cap

# Dynamic Quality Scoring
quality_scoring:
  update_frequency: 300  # seconds (5 minutes)

  volatility_analysis:
    lookback_periods: [7, 30, 90, 365]
    volatility_models: ["realized", "garch", "ewma"]
    stress_scenarios: ["2008_crisis", "covid_crash", "black_swan"]

  liquidity_analysis:
    volume_metrics: ["average", "median", "percentile_90"]
    spread_analysis: true
    order_book_depth: true

  governance_analysis:
    decentralization_score: true
    voting_participation: true
    proposal_quality: true
    community_health: true

# Stress Testing Parameters
stress_testing:
  scenarios:
    market_crash:
      severity: "severe"
      price_drops: [0.2, 0.4, 0.6, 0.8]
      correlation_increase: 0.3
      liquidity_decrease: 0.5

    flash_crash:
      severity: "extreme"
      price_drops: [0.3, 0.5, 0.7]
      duration_minutes: [5, 15, 30]
      recovery_hours: [1, 6, 24]

    regulatory_shock:
      severity: "moderate"
      asset_specific_impact: true
      sector_correlations: true

    protocol_failure:
      severity: "severe"
      protocol_specific: true
      contagion_modeling: true

  monte_carlo:
    simulations: 10000
    confidence_intervals: [0.95, 0.99]
    var_calculations: true

# Optimization Recommendations
optimization:
  rebalancing:
    frequency_analysis: true
    cost_benefit_analysis: true
    tax_efficiency: false  # Not applicable for DeFi

  diversification:
    asset_class_limits:
      stablecoins: 0.4      # Max 40% in stablecoins
      blue_chip: 0.8        # Max 80% in blue chip
      alt_coins: 0.3        # Max 30% in alt coins
      defi_tokens: 0.2      # Max 20% in DeFi tokens

  risk_budgeting:
    volatility_budgets: true
    correlation_budgets: true
    liquidity_budgets: true

# Machine Learning Configuration
ml_configuration:
  training_data:
    historical_window: 1095  # 3 years
    minimum_observations: 100
    feature_engineering: true

  model_validation:
    cross_validation_folds: 5
    walk_forward_analysis: true
    out_of_sample_testing: 0.2

  model_monitoring:
    performance_tracking: true
    drift_detection: true
    auto_retraining: true
    retraining_threshold: 0.05

# Risk Metrics Configuration
risk_metrics:
  value_at_risk:
    confidence_levels: [0.95, 0.99]
    holding_periods: [1, 7, 30]

  expected_shortfall:
    confidence_levels: [0.95, 0.99]
    tail_risk_analysis: true

  maximum_drawdown:
    lookback_periods: [30, 90, 365]
    rolling_analysis: true

  beta_analysis:
    benchmark_assets: ["ALGO", "BTC", "ETH"]
    rolling_windows: [30, 90]

# Alert Configuration
alerts:
  liquidation_warnings:
    probability_threshold: 0.3
    notification_methods: ["log", "webhook"]

  quality_degradation:
    score_decrease_threshold: 0.1
    rapid_change_detection: true

  correlation_spikes:
    correlation_increase_threshold: 0.2
    systemic_risk_detection: true

# Database Configuration
database:
  collateral_intelligence_db: "notebooks/collateral_intelligence.db"
  model_storage_db: "notebooks/ml_models.db"
  cache_db: "notebooks/cache.db"

  retention_policies:
    raw_data: 365        # days
    processed_data: 180  # days
    model_predictions: 90 # days
    cache_data: 7        # days

# Performance Configuration
performance:
  parallel_processing: true
  max_workers: 4
  batch_processing: true
  batch_size: 100

  caching:
    redis_enabled: false
    memory_cache_size: "256MB"
    cache_ttl: 300  # seconds

  api_limits:
    rate_limit: 100  # requests per minute
    burst_limit: 10  # concurrent requests

# Asset Classification
asset_classification:
  blue_chip:
    - "ALGO"
    - "BTC"
    - "ETH"
    - "USDC"
    - "USDT"

  defi_tokens:
    patterns: ["DEFI", "YIELD", "LP", "POOL"]
    protocols: ["algofi", "folks", "tinyman"]

  stablecoins:
    - "USDC"
    - "USDT"
    - "STBL"
    - "gUSD"

  governance_tokens:
    patterns: ["GOV", "VOTE", "DAO"]

  experimental:
    market_cap_threshold: 1000000  # $1M
    age_threshold: 30  # days

# Fallback Configuration
fallbacks:
  data_unavailable:
    use_similar_assets: true
    similarity_threshold: 0.8
    fallback_to_category: true

  model_failure:
    use_rule_based: true
    conservative_estimates: true

  api_failure:
    cached_data_staleness: 3600  # seconds
    offline_mode: true