[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interest-rate-determiner"
version = "1.0.0"
authors = [
    {name = "Algorand Lending Ecosystem", email = "dev@algorand-lending.io"},
]
description = "Comprehensive interest rate determination system for DeFi lending on Algorand"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
keywords = [
    "algorand", "defi", "lending", "interest-rates", "blockchain",
    "cryptocurrency", "financial-services", "credit-scoring",
    "risk-assessment", "regulatory-compliance"
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
    "aioredis>=2.0.0",
    "asyncpg>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.12.0",
    "click>=8.1.0",
    "rich>=13.6.0",
    "typer>=0.9.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "py-algorand-sdk>=2.4.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client>=0.17.0",
    "structlog>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
]
testing = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-benchmark>=4.0.0",
    "factory-boy>=3.3.0",
    "faker>=19.12.0",
    "httpx>=0.25.0",
    "testcontainers>=3.7.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "myst-parser>=2.0.0",
    "sphinx-click>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/algorand-lending-ecosystem/interest-rate-determiner"
Documentation = "https://docs.algorand-lending.io/interest-rate-determiner"
Repository = "https://github.com/algorand-lending-ecosystem/interest-rate-determiner"
"Bug Reports" = "https://github.com/algorand-lending-ecosystem/interest-rate-determiner/issues"

[project.scripts]
rate-calculator = "interest_rate_determiner.cli.main:main"
market-analyzer = "interest_rate_determiner.cli.market_analyzer:main"
risk-assessor = "interest_rate_determiner.cli.risk_assessor:main"
credit-scorer = "interest_rate_determiner.cli.credit_scorer:main"
compliance-checker = "interest_rate_determiner.cli.compliance_checker:main"
dynamic-pricer = "interest_rate_determiner.cli.dynamic_pricer:main"
rate-optimizer = "interest_rate_determiner.cli.rate_optimizer:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["interest_rate_determiner*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
interest_rate_determiner = [
    "data/*.json",
    "data/*.csv",
    "config/*.yaml",
    "config/*.json",
]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
    "integration_tests",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "external: marks tests that require external services",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["interest_rate_determiner"]
omit = [
    "tests/*",
    "integration_tests/*",
    "*/migrations/*",
    "setup.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]