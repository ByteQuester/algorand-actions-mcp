# Network Activity Monitor Configuration
# Algorand network health and ecosystem activity monitoring

network_monitoring:
  # Network health weights (total: 1.0)
  health_weights:
    transaction_throughput: 0.30      # TPS and block processing efficiency
    consensus_health: 0.25            # Block time consistency and participation
    node_participation: 0.20          # Network decentralization metrics
    mempool_status: 0.25              # Transaction queue and processing

  # DApp activity weights (total: 1.0)
  dapp_weights:
    smart_contract_activity: 0.35     # Application call frequency
    defi_protocol_usage: 0.30         # DEX and lending protocol activity
    nft_marketplace_activity: 0.15    # NFT trading and creation
    governance_activity: 0.20         # On-chain governance participation

# Network performance thresholds
network_thresholds:
  # Transaction throughput (TPS)
  tps_levels:
    excellent: 1000                   # > 1000 TPS
    good: 500                         # > 500 TPS
    average: 100                      # > 100 TPS
    poor: 50                          # > 50 TPS
    critical: 10                      # < 10 TPS

  # Block time consistency (seconds)
  block_time:
    target: 4.5                       # Target block time
    excellent_variance: 0.5           # ± 0.5 seconds
    good_variance: 1.0                # ± 1.0 seconds
    poor_variance: 2.0                # > 2.0 seconds variance

  # Consensus participation
  participation_levels:
    excellent: 0.95                   # > 95% participation
    good: 0.90                        # > 90% participation
    average: 0.85                     # > 85% participation
    poor: 0.80                        # > 80% participation
    critical: 0.75                    # < 75% participation

  # Mempool size (transactions)
  mempool_thresholds:
    normal: 1000                      # < 1k pending transactions
    elevated: 5000                    # < 5k pending transactions
    high: 10000                       # < 10k pending transactions
    critical: 20000                   # > 20k pending transactions

# DApp activity monitoring
dapp_monitoring:
  # Major DeFi protocols to monitor
  defi_protocols:
    tinyman:
      app_ids: [552635992, 624956175]  # Tinyman v1 and v2
      metrics: ["swaps", "liquidity", "volume"]

    algofi:
      app_ids: [465818260, 465818263]  # AlgoFi lending markets
      metrics: ["borrows", "supplies", "liquidations"]

    folks_finance:
      app_ids: [686498781, 686500029]  # Folks Finance pools
      metrics: ["deposits", "borrows", "governance"]

    pact:
      app_ids: [372382970]             # Pact AMM
      metrics: ["swaps", "farms", "staking"]

    algodex:
      app_ids: [354073718]             # Algodex order book
      metrics: ["orders", "trades", "makers"]

  # NFT marketplaces
  nft_platforms:
    algogems:
      app_ids: [403380490]
      metrics: ["sales", "listings", "volume"]

    rand_gallery:
      app_ids: [496304963]
      metrics: ["auctions", "sales", "collections"]

  # Activity thresholds
  activity_levels:
    high_activity: 10000              # > 10k daily transactions
    moderate_activity: 1000           # > 1k daily transactions
    low_activity: 100                 # > 100 daily transactions
    minimal_activity: 10              # > 10 daily transactions

# Network utilization categories
utilization_categories:
  very_high:
    min_tps: 800
    description: "Network operating at high capacity"
    rate_impact: -0.1                 # 10 bps reduction (high confidence)

  high:
    min_tps: 400
    description: "Strong network activity"
    rate_impact: -0.05                # 5 bps reduction

  moderate:
    min_tps: 100
    description: "Normal network activity"
    rate_impact: 0.0                  # No adjustment

  low:
    min_tps: 50
    description: "Below average activity"
    rate_impact: 0.05                 # 5 bps increase

  very_low:
    min_tps: 0
    description: "Minimal network activity"
    rate_impact: 0.1                  # 10 bps increase

# Algorand network configuration
algorand_config:
  # Node configuration for real-time data
  node:
    url: "https://mainnet-api.algonode.cloud"
    api_key: null
    timeout: 30

  # Indexer for historical data
  indexer:
    url: "https://mainnet-idx.algonode.cloud"
    api_key: null
    timeout: 30

  # Metrics endpoints
  metrics:
    node_metrics_url: "https://metrics.algorand.org/api/v1"
    algoexplorer_api: "https://algoindexer.algoexplorerapi.io"

# Real-time monitoring
real_time_config:
  # Polling intervals (seconds)
  polling_intervals:
    network_status: 30                # Network health check
    block_monitoring: 15              # Block production monitoring
    mempool_check: 60                 # Transaction pool status
    dapp_activity: 300                # DApp activity aggregation

  # Alerting thresholds
  alerts:
    low_tps_threshold: 50             # Alert if TPS drops below 50
    high_block_time_variance: 3.0     # Alert if block time varies >3s
    low_participation: 0.8            # Alert if participation <80%
    high_mempool: 15000               # Alert if mempool >15k transactions

# Historical analysis
historical_analysis:
  # Lookback periods for trend analysis
  analysis_periods:
    short_term: 24                    # 24 hours
    medium_term: 168                  # 1 week (168 hours)
    long_term: 720                    # 30 days (720 hours)

  # Trend detection
  trend_thresholds:
    strong_uptrend: 0.2               # >20% increase
    uptrend: 0.1                      # >10% increase
    stable: 0.05                      # ±5% change
    downtrend: -0.1                   # >10% decrease
    strong_downtrend: -0.2            # >20% decrease

# MCP integration
mcp_config:
  reader_port: 8002
  writer_port: 8003
  real_time_updates: true
  websocket_enabled: true
  stream_network_data: true

# Data aggregation
aggregation_config:
  # Time windows for aggregation
  time_windows:
    minute: 60                        # 1-minute aggregation
    hour: 3600                        # 1-hour aggregation
    day: 86400                        # 1-day aggregation

  # Metrics to aggregate
  aggregate_metrics:
    - "transaction_count"
    - "average_tps"
    - "block_time"
    - "participation_rate"
    - "application_calls"
    - "asset_transfers"

# Caching configuration
cache_config:
  network_metrics_ttl: 30             # 30 seconds for network metrics
  dapp_activity_ttl: 300              # 5 minutes for DApp activity
  historical_data_ttl: 3600           # 1 hour for historical data
  redis_url: "redis://localhost:6379"
  enable_cache: true

# Export configuration
export_config:
  # Data formats
  supported_formats: ["json", "csv", "parquet"]

  # Export destinations
  destinations:
    local_file: true
    s3_bucket: false
    api_endpoint: false

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "network_activity_monitor.log"
  max_bytes: 10485760                 # 10MB
  backup_count: 5

# Performance monitoring
performance_config:
  # Resource usage limits
  max_memory_usage: "1GB"
  max_cpu_usage: 80                   # 80% CPU usage threshold

  # Connection limits
  max_concurrent_requests: 50
  request_timeout: 30

  # Data retention
  metrics_retention_days: 30
  raw_data_retention_days: 7