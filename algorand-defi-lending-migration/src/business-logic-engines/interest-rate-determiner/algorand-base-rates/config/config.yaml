# Algorand Base Rates Engine Configuration

# MCP Service URLs for Algorand data
mcp_services:
  algorand_reader_url: "http://localhost:8002"
  market_data_url: "http://localhost:8003"

# ALGO staking parameters
algo_staking:
  base_reward_rate: 0.055          # 5.5% base annual reward rate
  participation_threshold: 0.8     # 80% participation required for full rewards
  soft_vote_weight: 1000000000000  # 1 million ALGO minimum for rewards
  reward_period_seconds: 8         # ~8 second block time
  compounding_frequency: "daily"   # Daily compounding for calculations

# Consensus participation parameters
consensus_participation:
  min_stake_algo: 1                # Minimum 1 ALGO to participate
  governance_bonus: 0.015          # 1.5% bonus for governance participation
  online_stake_requirement: 0.9    # 90% uptime required
  key_dilution_penalty: 0.001      # 0.1% penalty for key dilution

# Network health metrics affecting rates
network_health:
  target_participation_rate: 0.85  # 85% target participation
  min_healthy_participation: 0.70  # 70% minimum for healthy network
  participation_bonus_multiplier: 1.2  # 20% bonus for high participation
  security_multiplier: 1.1         # 10% bonus for network security

# Staking yield calculation parameters
yield_calculation:
  lookback_days: 30                # 30-day moving average for rates
  min_data_points: 20              # Minimum data points for reliable calculation
  volatility_adjustment: 0.02      # 2% adjustment for volatility
  liquidity_premium: 0.005         # 0.5% premium for liquidity provision

# Base rate components and weights
base_rate_components:
  staking_yield_weight: 0.60       # 60% weight for staking yields
  consensus_reward_weight: 0.25    # 25% weight for consensus participation
  governance_weight: 0.10          # 10% weight for governance participation
  network_security_weight: 0.05    # 5% weight for network security metrics

# Risk-free rate alternatives (blockchain native)
risk_free_alternatives:
  algo_staking:
    current_apy: 0.055             # Current ALGO staking APY
    risk_level: "low"              # Low risk for native staking
    liquidity: "high"              # High liquidity
  governance_rewards:
    additional_apy: 0.015          # Additional governance APY
    lock_period_days: 90           # 90-day governance period
    risk_level: "low"              # Low risk for governance

# Historical data configuration
historical_data:
  data_retention_days: 365         # Keep 1 year of historical data
  update_frequency_minutes: 15     # Update every 15 minutes
  cache_expiry_minutes: 10         # Cache expires after 10 minutes
  backup_data_sources: ["indexer", "algod", "participation_api"]

# Market condition adjustments
market_conditions:
  bull_market_adjustment: 0.005    # +0.5% in bull markets
  bear_market_adjustment: -0.010   # -1% in bear markets
  high_volatility_penalty: 0.015   # +1.5% during high volatility
  low_liquidity_penalty: 0.020     # +2% during low liquidity periods

# Emergency parameters
emergency_conditions:
  network_halt_fallback_rate: 0.040  # 4% fallback rate if network issues
  data_unavailable_rate: 0.045       # 4.5% rate when data unavailable
  max_rate_change_per_update: 0.001  # Max 0.1% change per update
  circuit_breaker_threshold: 0.050   # 5% absolute change triggers circuit breaker

# Quality assurance parameters
data_quality:
  min_confidence_score: 0.85       # 85% minimum confidence in data
  outlier_detection_std: 2.5       # 2.5 standard deviations for outliers
  smoothing_factor: 0.1            # 10% smoothing for rate changes
  validation_threshold: 0.95       # 95% validation threshold

# API endpoints for external data
external_apis:
  algorand_indexer: "https://mainnet-idx.algonode.cloud"
  algorand_node: "https://mainnet-api.algonode.cloud"
  participation_api: "https://participation-rewards.algorand.foundation"
  governance_api: "https://governance.algorand.foundation/api"

# Rate calculation methodology
calculation_methodology:
  primary_method: "participation_weighted"  # Weight by participation
  fallback_method: "simple_average"         # Simple average fallback
  adjustment_frequency: "real_time"         # Real-time rate adjustments
  smoothing_enabled: true                   # Enable rate smoothing

# Output format configuration
output_format:
  decimal_places: 6                # 6 decimal places for rates
  percentage_format: true          # Output as percentages
  include_metadata: true           # Include calculation metadata
  timestamp_format: "iso8601"      # ISO 8601 timestamp format

# Monitoring and alerting
monitoring:
  rate_change_alert_threshold: 0.01   # 1% change triggers alert
  data_staleness_alert_minutes: 30    # Alert if data older than 30 minutes
  network_health_alert_threshold: 0.7 # Alert if participation below 70%
  error_rate_threshold: 0.05          # 5% error rate threshold

# Integration settings
integration:
  enable_real_time_updates: true    # Enable real-time rate updates
  batch_processing: false           # Disable batch processing for real-time
  rate_publishing_enabled: true     # Publish rates to message queue
  webhook_notifications: false     # Disable webhook notifications