# On-chain Reputation Scoring Configuration
# Algorand blockchain-native reputation parameters

reputation_scoring:
  # Wallet behavior analysis weights (total: 1.0)
  wallet_weights:
    transaction_consistency: 0.25    # Regular transaction patterns
    balance_stability: 0.20          # Stable balance maintenance
    asset_diversity: 0.15            # ASA portfolio diversity
    defi_engagement: 0.25            # DeFi protocol usage
    network_longevity: 0.15          # Account age and activity

  # Governance participation weights (total: 1.0)
  governance_weights:
    participation_rate: 0.30         # Governance participation frequency
    voting_consistency: 0.25         # Consistent voting behavior
    algo_staking: 0.25               # ALGO commitment staking
    proposal_engagement: 0.20        # Community proposal participation

  # Transaction analysis parameters
  transaction_analysis:
    min_transactions: 10             # Minimum transactions for analysis
    lookback_days: 180               # Days to analyze transaction history
    consistency_threshold: 0.7       # Regular activity threshold
    large_transaction_factor: 0.1    # Impact of unusually large transactions

  # Balance and holding analysis
  balance_analysis:
    min_balance_algo: 10             # Minimum ALGO balance
    stability_window_days: 90        # Window for balance stability
    volatility_threshold: 0.3        # Maximum acceptable balance volatility
    asa_holding_bonus: 0.1           # Bonus for quality ASA holdings

  # DeFi engagement scoring
  defi_scoring:
    supported_protocols:
      - "tinyman"                    # Tinyman DEX
      - "algofi"                     # AlgoFi lending
      - "folks_finance"              # Folks Finance
      - "pact"                       # Pact AMM
      - "algodex"                    # Algodex DEX
    activity_bonus: 0.15             # Bonus for multi-protocol usage
    liquidity_provision_bonus: 0.2   # LP provision bonus
    yield_farming_bonus: 0.1         # Yield farming participation

# Algorand network configuration
algorand_config:
  # Indexer configuration
  indexer:
    url: "https://mainnet-idx.algonode.cloud"
    api_key: null                    # Optional API key
    timeout: 30                      # Request timeout seconds

  # Node configuration
  node:
    url: "https://mainnet-api.algonode.cloud"
    api_key: null                    # Optional API key
    timeout: 30                      # Request timeout seconds

  # Governance configuration
  governance:
    periods_to_analyze: 4            # Number of governance periods
    participation_threshold: 0.01    # Minimum participation for credit
    max_skip_penalty: 0.2           # Maximum penalty for skipped periods

# Reputation scoring tiers
reputation_tiers:
  excellent:
    min_score: 0.85
    rate_adjustment: -0.5            # 50 basis points reduction

  good:
    min_score: 0.70
    rate_adjustment: -0.25           # 25 basis points reduction

  average:
    min_score: 0.50
    rate_adjustment: 0.0             # No adjustment

  poor:
    min_score: 0.30
    rate_adjustment: 0.25            # 25 basis points increase

  very_poor:
    min_score: 0.0
    rate_adjustment: 0.5             # 50 basis points increase

# MCP integration
mcp_config:
  reader_port: 8002
  writer_port: 8003
  websocket_enabled: true
  real_time_updates: true

# Caching configuration
cache_config:
  wallet_analysis_ttl: 3600         # 1 hour cache for wallet analysis
  governance_data_ttl: 7200         # 2 hours cache for governance data
  network_data_ttl: 300             # 5 minutes cache for network data
  redis_url: "redis://localhost:6379"
  enable_cache: true

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "onchain_reputation.log"
  max_bytes: 10485760               # 10MB
  backup_count: 5