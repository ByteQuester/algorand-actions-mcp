# DeFi Yield Analysis Engine Configuration

# MCP Service URLs for market data and protocol APIs
mcp_services:
  algorand_reader_url: "http://localhost:8002"
  market_data_url: "http://localhost:8003"

# DeFi Protocol Endpoints and Configuration
defi_protocols:
  algofi:
    name: "Algofi"
    api_endpoint: "https://api.algofi.org/v1"
    enabled: true
    weight: 0.4  # 40% weight in yield calculations
    supported_assets: ["ALGO", "USDC", "USDT", "goBTC", "goETH"]
    min_liquidity_threshold: 1000000  # $1M minimum liquidity
    reliability_score: 0.95

  folks_finance:
    name: "Folks Finance"
    api_endpoint: "https://api.folksfinance.com/v1"
    enabled: true
    weight: 0.35  # 35% weight in yield calculations
    supported_assets: ["ALGO", "USDC", "USDT", "OPUL", "PLANETS"]
    min_liquidity_threshold: 500000   # $500K minimum liquidity
    reliability_score: 0.90

  tinyman:
    name: "Tinyman"
    api_endpoint: "https://mainnet.analytics.tinyman.org/api/v1"
    enabled: true
    weight: 0.15  # 15% weight in yield calculations
    supported_assets: ["ALGO", "USDC", "USDT", "YLDY", "OPUL"]
    min_liquidity_threshold: 100000   # $100K minimum liquidity
    reliability_score: 0.85

  pact:
    name: "Pact"
    api_endpoint: "https://api.pact.fi/v1"
    enabled: true
    weight: 0.10  # 10% weight in yield calculations
    supported_assets: ["ALGO", "USDC", "USDT"]
    min_liquidity_threshold: 50000    # $50K minimum liquidity
    reliability_score: 0.80

# Yield Calculation Parameters
yield_calculation:
  lookback_days: 7                   # 7-day moving average for yields
  min_data_points: 5                 # Minimum data points for reliable calculation
  volatility_adjustment: 0.02        # 2% adjustment for yield volatility
  liquidity_premium_factor: 0.001    # 0.1% premium per $1M liquidity
  risk_adjustment_factor: 0.015      # 1.5% risk adjustment for DeFi protocols

# Asset-specific configurations
asset_configurations:
  ALGO:
    min_yield_threshold: 0.01        # 1% minimum yield
    max_yield_threshold: 0.25        # 25% maximum yield (circuit breaker)
    volatility_factor: 1.2           # Higher volatility multiplier
    liquidity_weight: 0.3            # 30% weight for liquidity considerations

  USDC:
    min_yield_threshold: 0.005       # 0.5% minimum yield
    max_yield_threshold: 0.15        # 15% maximum yield
    volatility_factor: 0.8           # Lower volatility multiplier
    liquidity_weight: 0.4            # 40% weight for liquidity

  USDT:
    min_yield_threshold: 0.005       # 0.5% minimum yield
    max_yield_threshold: 0.15        # 15% maximum yield
    volatility_factor: 0.8           # Lower volatility multiplier
    liquidity_weight: 0.4            # 40% weight for liquidity

  default:
    min_yield_threshold: 0.02        # 2% minimum yield for other assets
    max_yield_threshold: 0.50        # 50% maximum yield
    volatility_factor: 1.5           # Higher volatility for unknown assets
    liquidity_weight: 0.2            # 20% weight for liquidity

# Protocol-specific risk factors
protocol_risk_factors:
  algofi:
    smart_contract_risk: 0.002       # 0.2% for smart contract risk
    liquidity_risk: 0.001            # 0.1% for liquidity risk
    governance_risk: 0.001           # 0.1% for governance risk
    total_risk_adjustment: 0.004     # 0.4% total risk premium

  folks_finance:
    smart_contract_risk: 0.003       # 0.3% for smart contract risk
    liquidity_risk: 0.002            # 0.2% for liquidity risk
    governance_risk: 0.002           # 0.2% for governance risk
    total_risk_adjustment: 0.007     # 0.7% total risk premium

  tinyman:
    smart_contract_risk: 0.005       # 0.5% for smart contract risk (AMM)
    liquidity_risk: 0.003            # 0.3% for liquidity risk
    impermanent_loss_risk: 0.010     # 1.0% for impermanent loss
    total_risk_adjustment: 0.018     # 1.8% total risk premium

  pact:
    smart_contract_risk: 0.004       # 0.4% for smart contract risk
    liquidity_risk: 0.003            # 0.3% for liquidity risk
    governance_risk: 0.003           # 0.3% for governance risk
    total_risk_adjustment: 0.010     # 1.0% total risk premium

# Yield aggregation methodology
aggregation_methodology:
  primary_method: "liquidity_weighted"  # Weight by total value locked
  fallback_method: "arithmetic_mean"    # Simple average fallback
  outlier_removal: true                 # Remove statistical outliers
  outlier_threshold_std: 2.0            # 2 standard deviations
  minimum_protocols: 2                  # Minimum 2 protocols for aggregation

# Market condition adjustments
market_condition_adjustments:
  bull_market:
    yield_adjustment: 0.005          # +0.5% in bull markets
    risk_reduction: 0.002            # -0.2% risk adjustment

  bear_market:
    yield_adjustment: -0.010         # -1% in bear markets
    risk_increase: 0.005             # +0.5% additional risk

  high_volatility:
    yield_adjustment: 0.015          # +1.5% for volatility compensation
    risk_increase: 0.010             # +1% additional risk

  low_volatility:
    yield_adjustment: -0.005         # -0.5% in stable conditions
    risk_reduction: 0.003            # -0.3% risk adjustment

# Data quality and validation
data_quality:
  min_confidence_score: 0.80         # 80% minimum confidence
  max_staleness_minutes: 30          # Data older than 30 minutes is stale
  cross_validation_enabled: true     # Enable cross-protocol validation
  anomaly_detection_enabled: true    # Enable anomaly detection
  smoothing_factor: 0.15             # 15% smoothing for yield changes

# Historical data management
historical_data:
  retention_days: 90                 # Keep 90 days of historical data
  update_frequency_minutes: 10       # Update every 10 minutes
  cache_expiry_minutes: 5            # Cache expires after 5 minutes
  backup_calculation_hours: 24       # 24 hours of backup calculations

# Emergency and fallback parameters
emergency_conditions:
  protocol_unavailable_threshold: 0.5  # 50% of protocols must be available
  fallback_yield_rate: 0.06           # 6% fallback rate
  max_yield_change_per_update: 0.02   # Max 2% change per update
  circuit_breaker_enabled: true       # Enable circuit breakers

# API rate limiting and error handling
api_management:
  rate_limit_per_minute: 60          # 60 requests per minute per protocol
  retry_attempts: 3                  # 3 retry attempts for failed requests
  retry_backoff_seconds: 5           # 5 second backoff between retries
  timeout_seconds: 30                # 30 second timeout for API calls

# Real-time monitoring and alerting
monitoring:
  yield_change_alert_threshold: 0.05   # 5% change triggers alert
  protocol_downtime_alert_minutes: 15  # Alert if protocol down for 15 min
  data_quality_alert_threshold: 0.7    # Alert if confidence below 70%
  anomaly_detection_sensitivity: 2.5   # 2.5 std dev for anomaly detection

# Protocol-specific feature flags
feature_flags:
  enable_lending_yields: true        # Include lending protocol yields
  enable_liquidity_mining: true     # Include liquidity mining rewards
  enable_governance_rewards: true   # Include governance token rewards
  enable_trading_fees: true         # Include trading fee yields
  enable_staking_derivatives: true  # Include staking derivative yields

# Yield composition weights
yield_composition:
  base_lending_rate: 0.50           # 50% from base lending rates
  liquidity_mining_rewards: 0.25    # 25% from liquidity mining
  trading_fee_yields: 0.15          # 15% from trading fees
  governance_rewards: 0.10          # 10% from governance participation

# Integration settings for external systems
integration_settings:
  publish_to_message_queue: true    # Publish yields to message queue
  webhook_notifications: false     # Disable webhook notifications
  real_time_streaming: true        # Enable real-time yield streaming
  batch_processing_enabled: false  # Disable batch processing

# Output formatting
output_format:
  decimal_places: 6                 # 6 decimal places for yields
  percentage_format: true          # Output as percentages
  include_breakdown: true          # Include yield component breakdown
  include_confidence_score: true   # Include confidence scores
  timestamp_format: "iso8601"      # ISO 8601 timestamp format