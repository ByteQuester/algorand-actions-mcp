# Liquidation Scenarios Engine Configuration

# MCP Service URLs
mcp_services:
  algorand_reader_url: "http://localhost:8002"
  market_data_url: "http://localhost:8003"

# Slippage calculation parameters
slippage_calculation:
  max_slippage_cap: 0.50              # Maximum allowed slippage (50%)
  volume_ratio_power: 0.7             # Power factor for volume ratio calculation
  base_slippage_factor: 0.1           # Base slippage multiplier
  depth_penalty_factor: 0.02          # Penalty factor for exceeding market depth
  max_depth_penalty: 0.20             # Maximum depth penalty (20%)
  speed_power_factor: 0.5             # Power factor for speed multiplier

# Liquidation timing parameters
liquidation_timing:
  volume_thresholds:
    very_small: 0.01                  # <1% of daily volume
    small: 0.05                       # 1-5% of daily volume
    medium: 0.10                      # 5-10% of daily volume
    large: 0.25                       # 10-25% of daily volume

  base_liquidation_times:             # Hours for each volume tier
    very_small: 0.5
    small: 2.0
    medium: 8.0
    large: 24.0
    very_large: 48.0

  time_constraints:
    min_hours: 0.1                    # 6 minutes minimum
    max_hours: 168.0                  # 1 week maximum

# Liquidity tier adjustments
liquidity_adjustments:
  high: 0.5                           # High liquidity = faster liquidation
  medium: 1.0                         # Standard timing
  low: 2.0                            # Low liquidity = slower liquidation

# Urgency level adjustments
urgency_adjustments:
  immediate: 0.25                     # Force fast liquidation
  urgent: 0.5                         # Somewhat faster
  normal: 1.0                         # Standard timing
  patient: 2.0                        # Take time for better prices

# Market impact thresholds
market_impact_thresholds:
  low: 0.01                           # <1% of daily volume
  medium: 0.05                        # 1-5% of daily volume
  high: 0.05                          # >5% of daily volume

# Liquidation strategy parameters
liquidation_strategies:
  immediate:
    max_slippage_tolerance: 0.15      # 15% max slippage
    target_completion_time: 1.0       # 1 hour
    min_recovery_rate: 0.80           # 80% recovery minimum
    market_impact_limit: 0.10         # 10% market impact limit
    gas_cost_consideration: true

  gradual:
    max_slippage_tolerance: 0.05      # 5% max slippage
    target_completion_time: 24.0      # 24 hours
    min_recovery_rate: 0.90           # 90% recovery minimum
    market_impact_limit: 0.03         # 3% market impact limit
    gas_cost_consideration: true

  selective:
    max_slippage_tolerance: 0.08      # 8% max slippage
    target_completion_time: 2.0       # 2 hours
    min_recovery_rate: 0.85           # 85% recovery minimum
    market_impact_limit: 0.05         # 5% market impact limit
    gas_cost_consideration: true

# Transaction and execution parameters
execution_parameters:
  default_gas_cost_usd: 50.0          # Default gas cost estimate
  tranche_delay_hours: 0.5            # 30 minutes between tranches
  depth_safety_factor: 0.5            # Use 50% of market depth per tranche
  max_tranches: 10                    # Maximum number of execution tranches

# Liquidation feasibility assessment
feasibility_assessment:
  volume_impact_thresholds:
    very_high: 0.01                   # <1% impact = very high feasibility
    high: 0.05                        # 1-5% impact = high feasibility
    medium: 0.15                      # 5-15% impact = medium feasibility
    low: 0.30                         # 15-30% impact = low feasibility
    very_low: 0.30                    # >30% impact = very low feasibility

  confidence_scores:
    very_high: 0.95
    high: 0.85
    medium: 0.70
    low: 0.50
    very_low: 0.25

# Flash loan integration parameters
flash_loan_integration:
  enabled: true
  max_flash_loan_amount: 10000000     # $10M maximum flash loan
  flash_loan_fee_rate: 0.0009         # 0.09% flash loan fee
  flash_loan_gas_multiplier: 2.0      # 2x gas costs for flash loan transactions
  supported_protocols: ["aave", "dydx", "balancer"]

# Emergency liquidation scenarios
emergency_scenarios:
  oracle_failure:
    fallback_discount: 0.20           # 20% discount on last known price
    max_liquidation_delay: 2.0        # 2 hours max delay
    confidence_penalty: 0.30          # 30% confidence reduction

  volatility_spike:
    volatility_threshold: 0.50        # 50% volatility triggers emergency
    slippage_multiplier: 1.5          # 1.5x normal slippage expectations
    urgency_override: "immediate"     # Force immediate liquidation

  black_swan:
    market_crash_threshold: 0.30      # 30% market drop
    emergency_slippage_tolerance: 0.25 # Accept up to 25% slippage
    override_recovery_requirements: true
    priority_liquidation_only: true   # Only liquidate highest priority assets

# Auction and liquidation mechanics
auction_parameters:
  dutch_auction:
    enabled: true
    starting_discount: 0.05           # Start with 5% discount
    discount_increment: 0.01          # Increase by 1% every interval
    time_interval_minutes: 15         # 15-minute intervals
    max_discount: 0.20                # Maximum 20% discount

  sealed_bid_auction:
    enabled: false
    minimum_bid_increment: 0.005      # 0.5% minimum bid increment
    auction_duration_hours: 4         # 4-hour auction window
    reserve_price_discount: 0.10      # 10% below market price reserve

# Recovery rate calculations
recovery_rates:
  asset_type_adjustments:
    highly_liquid: 0.95               # 95% recovery for highly liquid assets
    liquid: 0.90                      # 90% recovery for liquid assets
    illiquid: 0.75                    # 75% recovery for illiquid assets

  market_condition_adjustments:
    bull_market: 1.05                 # 5% bonus in bull markets
    normal_market: 1.00               # No adjustment
    bear_market: 0.90                 # 10% penalty in bear markets
    crisis_market: 0.70               # 30% penalty in crisis

# Penalty and incentive structures
liquidation_penalties:
  borrower_penalty_rate: 0.05         # 5% penalty to borrower
  liquidator_bonus_rate: 0.03         # 3% bonus to liquidator
  protocol_fee_rate: 0.02             # 2% protocol fee
  insurance_fund_rate: 0.01           # 1% to insurance fund

# Risk monitoring thresholds
risk_monitoring:
  position_concentration_limit: 0.30  # 30% max position concentration
  portfolio_correlation_limit: 0.70   # 70% max correlation between assets
  volatility_spike_threshold: 2.0     # 2x normal volatility triggers alert
  liquidity_drop_threshold: 0.50      # 50% liquidity drop triggers alert

# Analysis and reporting
analysis:
  default_confidence_score: 0.8
  data_quality_score: 0.85
  simulation_iterations: 1000         # Monte Carlo simulation iterations
  stress_test_scenarios: 5            # Number of stress test scenarios
  cache_expiry_minutes: 3             # 3-minute cache for real-time data

# Database configuration
database:
  default_path: "notebooks/liquidation_analysis.db"
  max_history_limit: 500
  backup_enabled: true
  backup_interval_hours: 6