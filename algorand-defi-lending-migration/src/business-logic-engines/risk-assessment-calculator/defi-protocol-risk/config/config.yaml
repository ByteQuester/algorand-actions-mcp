# DeFi Protocol Risk Engine Configuration

# MCP Service URLs
mcp_services:
  algorand_reader_url: "http://localhost:8002"
  market_data_url: "http://localhost:8003"

# Major Algorand DeFi Protocols
algorand_protocols:
  algofi:
    name: "Algofi"
    category: "lending"
    tvl_weight: 0.35          # 35% of DeFi TVL
    risk_tier: "tier_1"       # Tier 1 = most established
    governance_token: "BANK"
    launch_date: "2021-11-01"
    audit_status: "audited"
    governance_concentration: 0.4  # 40% token concentration
    primary_pools: ["ALGO", "USDC", "USDT", "goBTC", "goETH"]

  folks_finance:
    name: "Folks Finance"
    category: "lending"
    tvl_weight: 0.25          # 25% of DeFi TVL
    risk_tier: "tier_1"
    governance_token: "FOLKS"
    launch_date: "2022-03-01"
    audit_status: "audited"
    governance_concentration: 0.35
    primary_pools: ["ALGO", "USDC", "USDT", "gALGO"]

  tinyman:
    name: "Tinyman"
    category: "dex"
    tvl_weight: 0.20          # 20% of DeFi TVL
    risk_tier: "tier_1"
    governance_token: "TINY"
    launch_date: "2021-10-01"
    audit_status: "audited"
    governance_concentration: 0.3
    primary_pools: ["ALGO/USDC", "ALGO/USDT", "USDC/USDT"]

  pact:
    name: "Pact"
    category: "dex"
    tvl_weight: 0.10          # 10% of DeFi TVL
    risk_tier: "tier_2"
    governance_token: "PACT"
    launch_date: "2022-06-01"
    audit_status: "audited"
    governance_concentration: 0.45
    primary_pools: ["ALGO/USDC", "ALGO/PACT"]

  humble_defi:
    name: "Humble DeFi"
    category: "staking"
    tvl_weight: 0.05          # 5% of DeFi TVL
    risk_tier: "tier_2"
    governance_token: "HMBL"
    launch_date: "2022-08-01"
    audit_status: "partial"
    governance_concentration: 0.6
    primary_pools: ["ALGO", "HMBL"]

  algomint:
    name: "AlgoMint"
    category: "bridge"
    tvl_weight: 0.03          # 3% of DeFi TVL
    risk_tier: "tier_2"
    governance_token: null
    launch_date: "2021-12-01"
    audit_status: "audited"
    governance_concentration: 1.0  # Centralized
    primary_pools: ["goBTC", "goETH"]

  yieldly:
    name: "Yieldly"
    category: "staking"
    tvl_weight: 0.02          # 2% of DeFi TVL
    risk_tier: "tier_3"
    governance_token: "YLDY"
    launch_date: "2021-06-01"
    audit_status: "outdated"
    governance_concentration: 0.7
    primary_pools: ["ALGO", "YLDY"]

# Protocol Risk Weights and Thresholds
protocol_risk_weights:
  tvl_concentration_risk: 0.3      # 30% weight for TVL concentration
  governance_risk: 0.25            # 25% weight for governance issues
  systemic_risk: 0.25              # 25% weight for systemic connections
  yield_sustainability_risk: 0.2   # 20% weight for yield sustainability

# Concentration Risk Thresholds
concentration_thresholds:
  single_protocol_max: 0.4         # 40% max exposure to single protocol
  protocol_category_max: 0.6       # 60% max in single category (lending/dex/staking)
  tier_1_protocols_min: 0.7        # 70% min in tier 1 protocols
  governance_token_concentration_max: 0.5  # 50% max governance concentration

# Systemic Risk Parameters
systemic_risk_parameters:
  cross_protocol_correlation_threshold: 0.8  # 80% correlation triggers systemic risk
  cascade_failure_probability: 0.15          # 15% probability of cascade failure
  contagion_spread_factor: 0.6               # 60% contagion spread between protocols
  liquidity_shock_multiplier: 1.5            # 1.5x impact during liquidity shocks

# Governance Risk Assessment
governance_risk_factors:
  token_concentration_threshold: 0.5         # 50% concentration = high risk
  voting_participation_min: 0.2              # 20% min participation
  admin_key_concentration_max: 0.3           # 30% max admin key concentration
  upgrade_timelock_min_hours: 48             # 48 hours min timelock

# Yield Sustainability Analysis
yield_sustainability_metrics:
  ponzi_risk_indicators:
    yield_source_transparency: 0.8           # 80% transparency required
    revenue_yield_ratio: 2.0                 # 2x revenue to yield ratio min
    user_growth_sustainability: 0.05         # 5% monthly sustainable growth
    token_emission_sustainability: 0.02      # 2% monthly emission rate max

  warning_thresholds:
    unsustainable_yield_threshold: 0.5       # 50% APY = investigate
    ponzi_probability_threshold: 0.3         # 30% ponzi probability = warning
    token_dump_risk_threshold: 0.4           # 40% dump risk = warning

# TVL Stability Parameters
tvl_stability_metrics:
  withdrawal_pressure_indicators:
    daily_outflow_threshold: 0.1             # 10% daily outflow = pressure
    weekly_outflow_threshold: 0.25           # 25% weekly outflow = high pressure
    user_exodus_threshold: 0.15              # 15% user exodus = critical

  stability_factors:
    liquidity_depth_factor: 0.3              # 30% weight for liquidity depth
    user_stickiness_factor: 0.3              # 30% weight for user retention
    yield_competitiveness_factor: 0.2        # 20% weight for competitive yields
    protocol_trust_factor: 0.2               # 20% weight for protocol trust

# Market Condition Adjustments
market_condition_multipliers:
  bull_market:
    systemic_risk_reduction: 0.8             # 20% systemic risk reduction
    governance_risk_reduction: 0.9           # 10% governance risk reduction

  bear_market:
    systemic_risk_increase: 1.4              # 40% systemic risk increase
    governance_risk_increase: 1.2            # 20% governance risk increase
    liquidity_risk_increase: 1.5             # 50% liquidity risk increase

  high_volatility:
    all_risk_multiplier: 1.3                 # 30% increase in all risks
    correlation_increase: 0.2                # 20% correlation increase

  defi_crisis:
    systemic_risk_multiplier: 2.0            # 100% systemic risk increase
    cascade_probability_increase: 0.3        # 30% cascade probability increase

# Cross-Protocol Correlation Matrix (simplified)
protocol_correlations:
  algofi_folks: 0.85                         # High correlation (both lending)
  algofi_tinyman: 0.6                        # Medium correlation
  folks_tinyman: 0.55                        # Medium correlation
  tinyman_pact: 0.9                          # Very high correlation (both DEXs)
  lending_protocols_correlation: 0.8         # Overall lending correlation
  dex_protocols_correlation: 0.85            # Overall DEX correlation

# Stress Test Scenarios
stress_test_scenarios:
  major_protocol_failure:
    description: "Largest protocol (Algofi) fails"
    affected_protocols: ["algofi"]
    contagion_spread: 0.7                    # 70% spread to other protocols
    tvl_impact: -0.4                         # 40% TVL reduction
    user_confidence_impact: -0.6             # 60% confidence reduction

  governance_attack:
    description: "Governance token attack on major protocol"
    risk_increase_multiplier: 2.0            # 2x governance risk increase
    affected_categories: ["lending", "dex"]
    confidence_impact: -0.4                  # 40% confidence reduction

  liquidity_crisis:
    description: "Major liquidity drought"
    liquidity_reduction: 0.8                 # 80% liquidity reduction
    yield_sustainability_impact: -0.5        # 50% yield impact
    withdrawal_pressure_increase: 3.0        # 3x withdrawal pressure

  regulatory_crackdown:
    description: "Regulatory action against DeFi"
    all_protocols_impact: -0.3               # 30% negative impact
    governance_risk_increase: 1.5            # 50% governance risk increase
    user_exodus_probability: 0.4             # 40% user exodus probability

# Risk Scoring Parameters
risk_scoring:
  excellent: 0.9          # 90%+ score = excellent
  good: 0.75              # 75%+ score = good
  moderate: 0.6           # 60%+ score = moderate
  poor: 0.4               # 40%+ score = poor
  critical: 0.2           # Below 20% = critical

  weights:
    protocol_concentration: 0.25
    systemic_exposure: 0.25
    governance_quality: 0.2
    yield_sustainability: 0.15
    tvl_stability: 0.15

# Alert Thresholds
alert_thresholds:
  high_concentration_warning: 0.35          # 35% concentration triggers warning
  systemic_risk_warning: 0.6               # 60% systemic risk triggers warning
  governance_risk_critical: 0.7            # 70% governance risk = critical
  yield_unsustainability_warning: 0.4      # 40% unsustainable yield warning
  cascade_risk_critical: 0.3               # 30% cascade risk = critical

# Data Sources and Integration
data_sources:
  protocol_apis:
    algofi_api: "https://api.algofi.org"
    folks_api: "https://api.folks.finance"
    tinyman_api: "https://mainnet.analytics.tinyman.org"
    defillama_api: "https://api.llama.fi"

  governance_data:
    snapshot_spaces: ["algofi.eth", "folks-finance.eth"]
    on_chain_governance: true
    voting_power_tracking: true

  yield_tracking:
    yield_sources_verification: true
    revenue_tracking: true
    token_emission_monitoring: true

# Cache and Performance
caching:
  protocol_data_cache_minutes: 5
  correlation_matrix_cache_hours: 1
  stress_test_cache_hours: 6
  governance_data_cache_minutes: 15

# Analysis Configuration
analysis:
  default_confidence_score: 0.8
  minimum_data_quality_threshold: 0.7
  portfolio_rebalancing_threshold: 0.1      # 10% risk change triggers rebalancing
  early_warning_sensitivity: 0.05           # 5% change triggers early warning