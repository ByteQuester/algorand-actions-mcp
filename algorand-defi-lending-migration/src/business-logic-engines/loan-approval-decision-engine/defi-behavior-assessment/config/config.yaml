# DeFi Behavior Assessment Engine Configuration

# MCP Service URLs
mcp_services:
  algorand_reader_url: "http://localhost:8002"
  market_data_url: "http://localhost:8003"

# DeFi Protocol Integration Settings
protocols:
  algofi:
    weight: 0.25
    api_endpoints:
      - "https://api.algofi.org/v1"
    protocol_id: "algofi"
    risk_factor: 1.0
  folks_finance:
    weight: 0.20
    api_endpoints:
      - "https://api.folks.finance/v1"
    protocol_id: "folks"
    risk_factor: 1.1
  tinyman:
    weight: 0.20
    api_endpoints:
      - "https://api.tinyman.org/v1"
    protocol_id: "tinyman"
    risk_factor: 0.9
  pact:
    weight: 0.15
    api_endpoints:
      - "https://api.pact.fi/v1"
    protocol_id: "pact"
    risk_factor: 1.0
  humble:
    weight: 0.10
    api_endpoints:
      - "https://api.humble.sh/v1"
    protocol_id: "humble"
    risk_factor: 1.2
  wagmiswap:
    weight: 0.10
    api_endpoints:
      - "https://api.wagmiswap.io/v1"
    protocol_id: "wagmiswap"
    risk_factor: 1.1

# Behavior Scoring Parameters
behavior_scoring:
  sophistication_weights:
    basic_trading: 0.1
    yield_farming: 0.25
    liquidity_provision: 0.30
    arbitrage: 0.20
    governance_participation: 0.15

  risk_management_weights:
    diversification: 0.25
    position_sizing: 0.20
    stop_loss_usage: 0.20
    hedging_strategies: 0.20
    timing_analysis: 0.15

  protocol_engagement_weights:
    multi_protocol_usage: 0.30
    protocol_loyalty: 0.15
    new_protocol_adoption: 0.20
    governance_voting: 0.20
    community_activity: 0.15

# Risk Assessment Thresholds
risk_thresholds:
  sophistication_levels:
    novice: 0.3      # Basic DeFi usage
    intermediate: 0.6 # Regular yield farming, LP
    advanced: 0.8    # Complex strategies, arbitrage
    expert: 0.9      # Sophisticated risk management

  risk_tolerance_levels:
    conservative: 0.2
    moderate: 0.5
    aggressive: 0.8
    speculative: 1.0

  diversification_thresholds:
    poor: 0.2        # Concentrated in 1-2 protocols
    adequate: 0.5    # 3-5 protocols
    good: 0.7        # 5-8 protocols
    excellent: 0.9   # 8+ protocols with balance

# Behavior Pattern Analysis
pattern_analysis:
  time_windows:
    short_term: 30   # days
    medium_term: 90  # days
    long_term: 365   # days

  trading_patterns:
    frequency_thresholds:
      low: 5         # transactions per month
      medium: 20
      high: 50
      very_high: 100

    timing_analysis:
      market_timing_weight: 0.3
      volatility_response: 0.4
      trend_following: 0.3

  yield_optimization:
    strategy_complexity:
      basic: 0.2     # Single protocol staking
      intermediate: 0.5 # Cross-protocol farming
      advanced: 0.8  # Complex strategies with hedging
      expert: 1.0    # Automated strategy optimization

# Liquidity Behavior Analysis
liquidity_behavior:
  lp_provision_scoring:
    duration_weights:
      short_term: 0.1  # < 7 days
      medium_term: 0.3 # 7-30 days
      long_term: 0.6   # > 30 days

    impermanent_loss_management:
      awareness_indicators:
        - stable_pair_preference
        - correlated_asset_pairs
        - hedging_positions

    pool_selection_sophistication:
      fee_tier_optimization: 0.3
      volume_analysis: 0.25
      apr_sustainability: 0.25
      risk_adjusted_returns: 0.2

# Market Cycle Behavior
market_cycle_analysis:
  bull_market_behavior:
    risk_escalation_tendency: 0.3
    profit_taking_discipline: 0.4
    leverage_usage: 0.3

  bear_market_behavior:
    position_management: 0.4
    defensive_strategies: 0.3
    opportunity_recognition: 0.3

  volatility_response:
    panic_selling_tendency: -0.5
    contrarian_positioning: 0.3
    hedging_activation: 0.4

# Protocol-Specific Behavior Scoring
protocol_specific_scoring:
  lending_protocols:
    collateral_management: 0.4
    leverage_discipline: 0.3
    liquidation_avoidance: 0.3

  dex_protocols:
    slippage_optimization: 0.3
    arbitrage_recognition: 0.4
    timing_efficiency: 0.3

  yield_protocols:
    strategy_complexity: 0.3
    risk_adjusted_thinking: 0.4
    sustainability_awareness: 0.3

# Risk Management Assessment
risk_management:
  portfolio_management:
    correlation_awareness: 0.25
    concentration_limits: 0.25
    rebalancing_discipline: 0.25
    risk_budgeting: 0.25

  defensive_strategies:
    stop_loss_implementation: 0.3
    hedging_sophistication: 0.4
    insurance_usage: 0.3

  stress_testing:
    scenario_preparation: 0.4
    contingency_planning: 0.3
    liquidity_management: 0.3

# Governance and Community Engagement
governance_scoring:
  voting_participation:
    frequency_weight: 0.4
    informed_voting: 0.6

  proposal_quality:
    constructive_proposals: 0.7
    community_support: 0.3

  ecosystem_contribution:
    education_sharing: 0.3
    protocol_feedback: 0.4
    bug_reporting: 0.3

# Scoring Algorithms
scoring_algorithms:
  exponential_decay_factor: 0.1  # Recent activity weighted more
  minimum_activity_threshold: 10 # Minimum transactions for scoring
  confidence_intervals:
    high_confidence: 100  # transactions
    medium_confidence: 50
    low_confidence: 20

# Integration Settings
integration:
  blockchain_collateral_analyzer:
    correlation_factor: 0.3
    shared_risk_metrics: true

  interest_rate_determiner:
    behavior_adjustment_factor: 0.15
    reputation_integration: true

# Cache and Performance
cache_settings:
  behavior_cache_ttl: 3600  # 1 hour
  protocol_data_ttl: 1800   # 30 minutes
  score_recalculation_interval: 7200  # 2 hours

# Analysis Output Configuration
output_configuration:
  score_precision: 3
  confidence_threshold: 0.7
  minimum_data_points: 10

# Database Configuration
database:
  behavior_analysis_db: "notebooks/behavior_analysis.db"
  historical_patterns_db: "notebooks/historical_patterns.db"
  max_history_retention_days: 365