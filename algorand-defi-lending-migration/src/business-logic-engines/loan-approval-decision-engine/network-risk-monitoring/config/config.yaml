# Network Risk Monitoring Engine Configuration
# Real-time Algorand ecosystem risk assessment and early warning system

ecosystem_health:
  # Core health metrics weights (total: 100%)
  health_metrics:
    tvl_stability: 0.25          # Total Value Locked stability
    protocol_growth: 0.20        # New protocol adoption and growth
    transaction_volume: 0.15     # Network usage and activity
    developer_activity: 0.15     # Development momentum
    governance_health: 0.10      # Governance participation and stability
    security_incidents: 0.15     # Security event impact

  # Health scoring thresholds
  health_thresholds:
    excellent: 85
    good: 70
    moderate: 50
    concerning: 30
    critical: 15

  # TVL monitoring parameters
  tvl_monitoring:
    significant_change_threshold: 0.15  # 15% change triggers alert
    critical_change_threshold: 0.30     # 30% change triggers critical alert
    monitoring_window_hours: 24         # Monitor changes over 24 hours
    comparison_periods: [7, 30, 90]     # Compare against 7, 30, 90 day averages

  # Protocol growth metrics
  protocol_growth:
    new_protocol_weight: 0.4
    existing_protocol_growth_weight: 0.6
    growth_lookback_days: 30
    stagnation_threshold: -0.05  # 5% decline considered stagnation

protocol_risk:
  # DeFi protocol risk categories
  risk_categories:
    smart_contract_risk: 0.30
    liquidity_risk: 0.25
    governance_risk: 0.20
    oracle_risk: 0.15
    operational_risk: 0.10

  # Risk scoring methodology
  risk_scoring:
    exploit_severity_multipliers:
      critical: 3.0
      high: 2.0
      medium: 1.5
      low: 1.0
      informational: 0.5

    exploit_recency_decay:
      recent_days: 30
      decay_factor: 0.95  # Daily decay factor for older exploits

  # Protocol monitoring parameters
  monitoring_protocols:
    tier_1_protocols:  # Major protocols requiring intensive monitoring
      - "Tinyman"
      - "Folks Finance"
      - "AlgoFi"
      - "Pact"
      - "Humble DeFi"

    tier_2_protocols:  # Important protocols with standard monitoring
      - "Yieldly"
      - "AlgoSwap"
      - "WageStream"

    monitoring_intervals:
      tier_1_minutes: 5     # Monitor every 5 minutes
      tier_2_minutes: 15    # Monitor every 15 minutes
      other_minutes: 60     # Monitor every hour

  # Exploit detection parameters
  exploit_detection:
    anomaly_detection_windows: [1, 6, 24]  # Hours
    volume_spike_threshold: 5.0            # 5x normal volume
    price_deviation_threshold: 0.20        # 20% price deviation
    tvl_drain_threshold: 0.15              # 15% TVL reduction

market_conditions:
  # Market condition impact on lending risk
  condition_risk_multipliers:
    bull_market: 0.8      # Reduce risk in bull markets
    bear_market: 1.4      # Increase risk in bear markets
    sideways: 1.0         # Neutral risk
    volatile: 1.6         # High risk in volatile markets
    crash: 2.5            # Very high risk during crashes

  # Market volatility thresholds
  volatility_thresholds:
    low: 0.20
    moderate: 0.40
    high: 0.60
    extreme: 0.80

  # Correlation analysis
  correlation_monitoring:
    algo_btc_threshold: 0.8     # High correlation warning
    algo_eth_threshold: 0.85    # High correlation warning
    defi_correlation_threshold: 0.9  # DeFi token correlation

  # Market condition detection
  market_indicators:
    trend_detection_days: [7, 30, 90]
    momentum_indicators: ["rsi", "macd", "bollinger"]
    volume_analysis_periods: [24, 168, 720]  # Hours

congestion_monitoring:
  # Network performance thresholds
  performance_thresholds:
    normal_tps: 1000
    congested_tps: 500
    critical_tps: 100

    normal_confirmation_time: 4.5  # seconds
    slow_confirmation_time: 10.0
    critical_confirmation_time: 30.0

  # Fee escalation monitoring
  fee_monitoring:
    normal_fee_algo: 0.001
    elevated_fee_algo: 0.01
    high_fee_algo: 0.1
    critical_fee_algo: 1.0

  # Congestion impact assessment
  congestion_impact:
    liquidation_delay_risk: 0.3    # Risk multiplier for delayed liquidations
    arbitrage_disruption: 0.2      # Risk from arbitrage disruption
    user_experience_degradation: 0.1

correlation_analysis:
  # Cross-protocol correlation monitoring
  correlation_metrics:
    price_correlation_window: 168  # Hours (7 days)
    tvl_correlation_window: 720    # Hours (30 days)
    volume_correlation_window: 168

  # Correlation risk thresholds
  risk_thresholds:
    high_correlation: 0.8
    very_high_correlation: 0.9
    systemic_correlation: 0.95

  # Contagion risk factors
  contagion_factors:
    shared_infrastructure: 1.5     # Protocols sharing infrastructure
    common_tokens: 1.3             # Protocols with overlapping tokens
    governance_overlap: 1.2        # Shared governance participants
    developer_overlap: 1.4         # Shared development teams

systemic_risk:
  # Ecosystem-wide risk assessment
  systemic_indicators:
    total_tvl_concentration: 0.25        # Risk from TVL concentration
    protocol_interdependence: 0.25       # Risk from protocol dependencies
    governance_centralization: 0.20      # Risk from governance concentration
    infrastructure_dependency: 0.15      # Risk from infrastructure dependencies
    regulatory_pressure: 0.15            # Risk from regulatory changes

  # Black swan event modeling
  black_swan_scenarios:
    algo_price_crash: 0.8         # 80% price drop scenario
    major_protocol_exploit: 0.7   # Major protocol hack scenario
    consensus_failure: 0.9        # Consensus mechanism failure
    regulatory_ban: 0.6           # Regulatory shutdown scenario

  # Early warning system
  early_warning:
    amber_alert_threshold: 60     # Moderate systemic risk
    red_alert_threshold: 80       # High systemic risk
    critical_alert_threshold: 95  # Critical systemic risk

# Risk engine configuration
risk_engine:
  # Risk aggregation weights
  risk_component_weights:
    ecosystem_health: 0.30
    protocol_risk: 0.25
    market_conditions: 0.20
    congestion_impact: 0.10
    correlation_risk: 0.10
    systemic_risk: 0.05

  # Risk level definitions
  risk_levels:
    very_low: 0-20
    low: 21-40
    moderate: 41-60
    high: 61-80
    very_high: 81-100

  # Dynamic risk adjustment parameters
  dynamic_adjustments:
    ltv_adjustments:
      very_low_risk: 0.05      # +5% LTV
      low_risk: 0.02           # +2% LTV
      moderate_risk: 0.00      # No change
      high_risk: -0.05         # -5% LTV
      very_high_risk: -0.15    # -15% LTV

    interest_rate_adjustments:
      very_low_risk: -0.001    # -0.1% rate
      low_risk: 0.000          # No change
      moderate_risk: 0.005     # +0.5% rate
      high_risk: 0.015         # +1.5% rate
      very_high_risk: 0.030    # +3.0% rate

    approval_threshold_adjustments:
      very_low_risk: -0.05     # Easier approval
      low_risk: 0.00           # No change
      moderate_risk: 0.02      # Slightly harder
      high_risk: 0.10          # Much harder
      very_high_risk: 0.25     # Very restrictive

# Data sources and API configurations
data_sources:
  # Algorand blockchain data
  algorand_apis:
    mainnet_algod: "https://mainnet-api.algonode.cloud"
    mainnet_indexer: "https://mainnet-idx.algonode.cloud"
    testnet_algod: "https://testnet-api.algonode.cloud"
    rate_limit_rps: 10

  # DeFi protocol APIs
  defi_protocols:
    tinyman:
      api_base: "https://mainnet.analytics.tinyman.org"
      endpoints:
        pools: "/api/v1/pools/"
        volume: "/api/v1/pools/volume/"
        tvl: "/api/v1/pools/tvl/"
      rate_limit_rps: 5

    folks_finance:
      api_base: "https://folks-router.folks.finance"
      endpoints:
        pools: "/api/v1/pools"
        lending: "/api/v1/lending-pools"
      rate_limit_rps: 5

    algofi:
      api_base: "https://api.algofi.org"
      endpoints:
        markets: "/api/v1/markets"
        protocols: "/api/v1/protocols"
      rate_limit_rps: 5

  # Market data sources
  market_data:
    coinmarketcap:
      api_base: "https://pro-api.coinmarketcap.com"
      api_key_required: true
      rate_limit_rps: 10

    coingecko:
      api_base: "https://api.coingecko.com/api/v3"
      rate_limit_rps: 10

    defillama:
      api_base: "https://api.llama.fi"
      endpoints:
        protocols: "/protocols"
        tvl: "/tvl"
        chains: "/chains"
      rate_limit_rps: 5

  # Security monitoring
  security_sources:
    github_security:
      base_url: "https://api.github.com"
      endpoints:
        advisories: "/advisories"
        vulnerabilities: "/search/repositories"
      rate_limit_rps: 30

    immunefi:
      api_base: "https://immunefi.com/api"
      endpoints:
        bounties: "/bounties"
        reports: "/vulnerability-reports"

# Alert and notification configuration
alerting:
  # Alert severity levels
  severity_levels:
    info: 0
    warning: 1
    critical: 2
    emergency: 3

  # Alert thresholds
  alert_triggers:
    ecosystem_health_warning: 40
    ecosystem_health_critical: 25
    protocol_exploit_detected: 1    # Any exploit triggers alert
    market_crash_threshold: -0.3    # 30% drop
    network_congestion_critical: 100  # TPS below 100

  # Notification channels
  notification_channels:
    email: true
    slack: true
    webhook: true
    database: true

  # Alert throttling
  throttling:
    duplicate_alert_window_minutes: 60
    max_alerts_per_hour: 10
    escalation_delays_minutes: [5, 15, 60]

# Cache and refresh settings
cache_settings:
  ecosystem_health_ttl: 300      # 5 minutes
  protocol_risk_ttl: 180         # 3 minutes
  market_data_ttl: 60            # 1 minute
  congestion_data_ttl: 30        # 30 seconds
  correlation_data_ttl: 900      # 15 minutes

  refresh_schedules:
    ecosystem_health: "*/5 * * * *"     # Every 5 minutes
    protocol_monitoring: "*/3 * * * *"   # Every 3 minutes
    market_data: "*/1 * * * *"           # Every minute
    correlation_analysis: "*/15 * * * *"  # Every 15 minutes
    systemic_risk: "0 */1 * * *"         # Every hour

# MCP integration ports
mcp_integration:
  risk_monitoring_port: 8002
  real_time_alerts_port: 8003
  data_aggregation_port: 8004