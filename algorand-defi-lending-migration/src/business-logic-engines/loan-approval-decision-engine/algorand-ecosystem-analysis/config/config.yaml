# Algorand Ecosystem Analysis Configuration
# Comprehensive configuration for ecosystem analysis parameters, scoring weights, and thresholds

analysis:
  # Analysis period settings
  default_analysis_period_days: 365
  min_analysis_period_days: 30
  max_analysis_period_days: 1095

  # Data freshness requirements
  max_data_age_hours: 24
  cache_expiry_hours: 6

  # Analysis depth levels
  depth_levels:
    basic: "wallet_fundamentals,transaction_patterns"
    standard: "wallet_fundamentals,transaction_patterns,asset_analysis,governance_basic"
    comprehensive: "wallet_fundamentals,transaction_patterns,asset_analysis,governance_detailed,defi_analysis,nft_analysis,cross_protocol"

# Scoring weights for ecosystem components
scoring_weights:
  wallet_age: 0.15
  transaction_activity: 0.20
  asset_diversity: 0.15
  governance_participation: 0.20
  defi_engagement: 0.20
  cross_protocol_activity: 0.10

# Thresholds for different risk levels
risk_thresholds:
  very_low:
    max_score: 20
    min_wallet_age_days: 730
    min_transactions: 500
    min_governance_votes: 10

  low:
    max_score: 40
    min_wallet_age_days: 365
    min_transactions: 100
    min_governance_votes: 5

  medium:
    max_score: 60
    min_wallet_age_days: 180
    min_transactions: 50
    min_governance_votes: 1

  high:
    max_score: 80
    min_wallet_age_days: 90
    min_transactions: 10
    min_governance_votes: 0

  very_high:
    max_score: 100
    min_wallet_age_days: 0
    min_transactions: 0
    min_governance_votes: 0

# Wallet footprint analysis
wallet_footprint:
  # Age scoring parameters
  age_scoring:
    excellent_threshold_days: 730  # 2 years
    good_threshold_days: 365      # 1 year
    fair_threshold_days: 180      # 6 months
    poor_threshold_days: 90       # 3 months

  # Transaction volume scoring
  volume_scoring:
    excellent_threshold: 100000   # ALGO
    good_threshold: 10000        # ALGO
    fair_threshold: 1000         # ALGO
    poor_threshold: 100          # ALGO

  # Activity consistency
  consistency_scoring:
    excellent_cv_threshold: 0.3   # Coefficient of variation
    good_cv_threshold: 0.5
    fair_cv_threshold: 0.8
    poor_cv_threshold: 1.2

# DApp engagement analysis
dapp_engagement:
  # Protocol categories and weights
  protocol_categories:
    defi:
      weight: 0.4
      protocols:
        - "tinyman"
        - "algofi"
        - "folks_finance"
        - "pact"
        - "humble_defi"

    gaming:
      weight: 0.2
      protocols:
        - "algogems"
        - "algorand_casino"
        - "cosmic_champs"

    nft:
      weight: 0.2
      protocols:
        - "algoxnft"
        - "ab2_gallery"
        - "dartroom"
        - "rand_gallery"

    infrastructure:
      weight: 0.1
      protocols:
        - "algoexplorer"
        - "algorand_wallet"
        - "myalgo_wallet"

    governance:
      weight: 0.1
      protocols:
        - "algorand_governance"
        - "xgov"

  # Sophistication scoring
  sophistication_thresholds:
    beginner:
      max_protocols: 2
      max_interactions: 10

    intermediate:
      max_protocols: 5
      max_interactions: 50

    advanced:
      max_protocols: 10
      max_interactions: 200

    expert:
      max_protocols: 999
      max_interactions: 999

# Asset portfolio analysis
asset_portfolio:
  # Diversification scoring
  diversification:
    excellent_min_assets: 10
    good_min_assets: 5
    fair_min_assets: 3
    poor_min_assets: 1

  # Asset quality weights
  asset_quality_weights:
    algo_native: 0.3
    verified_asa: 0.25
    stablecoins: 0.2
    defi_tokens: 0.15
    unverified_tokens: 0.1

  # Risk concentration thresholds
  concentration_risk:
    low_max_single_asset: 0.3    # 30% max in single asset
    medium_max_single_asset: 0.5  # 50% max
    high_max_single_asset: 0.7    # 70% max
    extreme_max_single_asset: 1.0 # 100%

# Governance participation analysis
governance:
  # Participation types and weights
  participation_weights:
    voter: 1.0
    proposer: 3.0
    delegator: 1.5
    validator: 5.0

  # Quality scoring parameters
  quality_scoring:
    consistency_weight: 0.4
    engagement_weight: 0.3
    influence_weight: 0.3

  # Thresholds for participation levels
  participation_levels:
    inactive:
      max_votes: 0
      max_proposals: 0

    casual:
      max_votes: 5
      max_proposals: 0

    active:
      max_votes: 20
      max_proposals: 1

    highly_active:
      max_votes: 999
      max_proposals: 999

# DeFi behavior analysis
defi_behavior:
  # Strategy detection parameters
  strategy_detection:
    arbitrage:
      min_frequency: 5          # Trades per month
      max_time_between_trades: 300  # Seconds

    yield_farming:
      min_lp_positions: 2
      min_staking_duration_days: 30

    liquidity_provision:
      min_lp_value: 1000        # USD equivalent
      min_duration_days: 7

    day_trading:
      min_trades_per_day: 5
      min_active_days: 10

  # Risk management scoring
  risk_management:
    stop_loss_usage_weight: 0.3
    position_sizing_weight: 0.3
    diversification_weight: 0.4

  # Sophistication indicators
  sophistication_indicators:
    flash_loans: 2.0            # Multiplier for sophistication score
    advanced_strategies: 1.5
    multi_protocol_arbitrage: 3.0
    automated_strategies: 2.5

# NFT portfolio analysis
nft_portfolio:
  # Collection quality tiers
  collection_tiers:
    blue_chip:
      weight: 3.0
      min_floor_price: 100      # ALGO
      collections:
        - "algorand_pandas"
        - "algogems"

    established:
      weight: 2.0
      min_floor_price: 10       # ALGO
      collections: []

    emerging:
      weight: 1.0
      min_floor_price: 1        # ALGO
      collections: []

    speculative:
      weight: 0.5
      min_floor_price: 0
      collections: []

  # Creator activity scoring
  creator_scoring:
    original_creations_weight: 2.0
    collection_success_weight: 1.5
    community_engagement_weight: 1.0

# Cross-protocol analysis
cross_protocol:
  # Bridge usage scoring
  bridge_scoring:
    occasional_usage: 0.8       # Risk multiplier
    frequent_usage: 1.2
    excessive_usage: 1.8

  # Bridge protocols and risk levels
  bridge_protocols:
    wormhole:
      risk_level: "medium"
      weight: 1.0

    portal_bridge:
      risk_level: "medium"
      weight: 1.0

    celer:
      risk_level: "low"
      weight: 0.8

  # Multi-chain behavior
  multi_chain_behavior:
    algorand_loyalty_bonus: 1.2  # Bonus for high Algorand native percentage
    chain_hopping_penalty: 0.8   # Penalty for excessive bridge usage

# Pattern recognition
pattern_recognition:
  # Detection thresholds
  detection_thresholds:
    wash_trading:
      min_circular_transactions: 3
      max_time_window_hours: 24
      min_confidence: 0.7

    sybil_behavior:
      min_unique_counterparties_ratio: 0.8
      min_new_address_interactions: 10
      min_confidence: 0.6

    market_manipulation:
      volume_spike_threshold: 10.0  # Times normal volume
      coordination_window_minutes: 60
      min_confidence: 0.8

  # Behavioral signatures
  behavioral_signatures:
    conservative_holder:
      buy_sell_ratio: 10.0      # More buys than sells
      hold_duration_days: 90
      volatility_tolerance: 0.2

    active_trader:
      daily_trade_frequency: 2.0
      protocol_diversity: 5
      risk_tolerance: 0.6

    defi_native:
      defi_transaction_ratio: 0.7
      yield_optimization: true
      advanced_strategies: true

# Data sources and integration
data_sources:
  # Algorand indexer settings
  algorand_indexer:
    base_url: "https://algoindexer.algoexplorerapi.io"
    timeout_seconds: 30
    retry_attempts: 3
    rate_limit_per_second: 10

  # External data sources
  external_sources:
    coingecko:
      enabled: true
      api_key: null
      timeout_seconds: 15

    defillama:
      enabled: true
      timeout_seconds: 20

# Caching and performance
caching:
  # Cache settings
  cache_settings:
    enabled: true
    default_ttl_hours: 6
    max_cache_size_mb: 500

  # Cache keys TTL
  cache_ttl:
    wallet_basic_data: 6        # Hours
    transaction_history: 24     # Hours
    governance_data: 48         # Hours
    nft_data: 12               # Hours
    price_data: 1              # Hours

# API and MCP integration
api_integration:
  # MCP service ports
  mcp_services:
    algorand_reader:
      port: 8002
      timeout_seconds: 30

    algorand_writer:
      port: 8003
      timeout_seconds: 45

  # Rate limiting
  rate_limiting:
    requests_per_minute: 100
    burst_limit: 20

# Monitoring and alerting
monitoring:
  # Performance thresholds
  performance_thresholds:
    analysis_timeout_seconds: 300
    max_memory_usage_mb: 1000
    max_cpu_usage_percent: 80

  # Alert conditions
  alerts:
    high_risk_detection: true
    suspicious_pattern_detection: true
    system_performance_degradation: true

  # Logging levels
  logging:
    level: "INFO"
    detailed_analysis_logging: false
    performance_logging: true

# Security and compliance
security:
  # Data handling
  data_handling:
    encrypt_sensitive_data: true
    anonymize_addresses: false
    retention_period_days: 365

  # Access control
  access_control:
    require_authentication: true
    audit_trail: true
    role_based_access: true