global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Actions MCP Worker
  - job_name: 'actions-mcp'
    static_configs:
      - targets: ['actions-mcp:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Remote MCP Worker  
  - job_name: 'remote-mcp'
    static_configs:
      - targets: ['remote-mcp:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s