services:
  # Remote MCP Worker - Blockchain data access and querying (testnet, read-only)
  remote-mcp:
    build:
      context: .
      dockerfile: apps/blockchain/algorand-remote-mcp/Dockerfile
    container_name: algorand-remote-mcp-testnet
    ports:
      - "8002:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - ALGORAND_NETWORK=testnet
      - ALGORAND_ALGOD=https://testnet-api.algonode.cloud
      - ALGORAND_INDEXER=https://testnet-idx.algonode.cloud
      - ALGORAND_TOKEN=
      - READ_ONLY=true
      - PERA_WALLET_API_URL=https://testnet.api.perawallet.app/v1/public
      - PERA_EXPLORER_URL=https://explorer.perawallet.app
      - NFD_API_URL=https://api.nf.domains
      - ITEMS_PER_PAGE=10
      # OAuth settings (not set for testnet read-only mode)
      - HCV_WORKER=
      - HCV_WORKER_URL=
      - VAULT_ENTITIES=
      - VAULT_OIDC_ACCESSOR=
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
      - COOKIE_ENCRYPTION_KEY=
    networks:
      - algorand-mcp-testnet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Actions MCP Worker - Transaction building, simulation, and submission (testnet)
  actions-mcp:
    build:
      context: .
      dockerfile: apps/blockchain/algorand-actions-mcp/Dockerfile
    container_name: algorand-actions-mcp-testnet
    ports:
      - "8001:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - ALGORAND_NETWORK=testnet
      - ALGORAND_ALGOD=https://testnet-api.algonode.cloud
      - ALGORAND_INDEXER=https://testnet-idx.algonode.cloud
      - ALGORAND_TOKEN=
      - READ_ONLY=false
      - ALLOW_MAINNET=false
    networks:
      - algorand-mcp-testnet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  algorand-mcp-testnet:
    driver: bridge
    name: algorand-mcp-testnet-network