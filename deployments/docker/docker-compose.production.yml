version: '3.8'

# 🐳 Algorand Lending Platform - Production Docker Compose
# Complete containerized production deployment with monitoring and security

services:
  # ==============================================================================
  # FRONTEND SERVICES
  # ==============================================================================

  # Lending UI (ADK Web Overlay)
  lending-ui:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.lending-ui
      args:
        - NODE_ENV=production
    container_name: algorand-lending-ui
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - PORT=8081
      - API_BASE_URL=http://lending-api:8003
      - LENDING_ONLY_MODE=true
      - HIDE_GENERIC_AGENTS=true
      - MCP_READER_URL=http://remote-mcp:8002
      - MCP_WRITER_URL=http://actions-mcp:3001
    volumes:
      - ../../apps/lending-platform/ui-overlay:/app/overlay:ro
      - ui-logs:/var/log/nginx
    networks:
      - algorand-lending
    depends_on:
      - lending-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lending-ui.rule=Host(`${DOMAIN:-lending.localhost}`)"
      - "traefik.http.routers.lending-ui.tls=true"
      - "traefik.http.routers.lending-ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.lending-ui.loadbalancer.server.port=8081"

  # ==============================================================================
  # BACKEND SERVICES
  # ==============================================================================

  # Lending API
  lending-api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.lending-api
      args:
        - ENVIRONMENT=production
    container_name: algorand-lending-api
    ports:
      - "8003:8003"
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lending_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lending_db}
      - JWT_SECRET=${JWT_SECRET}
      - ALGORAND_NETWORK=${ALGORAND_NETWORK:-testnet}
      - ALGORAND_ALGOD_URL=${ALGORAND_ALGOD_URL:-https://testnet-api.algonode.cloud}
      - ALGORAND_INDEXER_URL=${ALGORAND_INDEXER_URL:-https://testnet-idx.algonode.cloud}
      - MCP_READER_URL=http://remote-mcp:8002
      - MCP_WRITER_URL=http://actions-mcp:3001
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8081}
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
    env_file:
      - ../../.env.production
    volumes:
      - api-logs:/app/logs
      - ../../apps/lending-platform:/app/src:ro
    networks:
      - algorand-lending
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      remote-mcp:
        condition: service_started
      actions-mcp:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lending-api.rule=Host(`api.${DOMAIN:-lending.localhost}`)"
      - "traefik.http.routers.lending-api.tls=true"
      - "traefik.http.routers.lending-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.lending-api.loadbalancer.server.port=8003"

  # ==============================================================================
  # BLOCKCHAIN SERVICES
  # ==============================================================================

  # MCP Reader (Algorand Read Operations)
  remote-mcp:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.remote-mcp
      args:
        - NODE_ENV=production
    container_name: algorand-remote-mcp
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=production
      - MCP_PORT=8002
      - PORT=8002
      - ALGORAND_NETWORK=${ALGORAND_NETWORK:-testnet}
      - ALGORAND_ALGOD_URL=${ALGORAND_ALGOD_URL:-https://testnet-api.algonode.cloud}
      - ALGORAND_INDEXER_URL=${ALGORAND_INDEXER_URL:-https://testnet-idx.algonode.cloud}
      - ALGORAND_TOKEN=${ALGORAND_TOKEN:-}
      - READ_ONLY=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - mcp-reader-logs:/app/logs
    networks:
      - algorand-lending
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MCP Writer (Algorand Write Operations)
  actions-mcp:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.actions-mcp
      args:
        - NODE_ENV=production
    container_name: algorand-actions-mcp
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MCP_PORT=3001
      - PORT=3001
      - ALGORAND_NETWORK=${ALGORAND_NETWORK:-testnet}
      - ALGORAND_ALGOD_URL=${ALGORAND_ALGOD_URL:-https://testnet-api.algonode.cloud}
      - ALGORAND_INDEXER_URL=${ALGORAND_INDEXER_URL:-https://testnet-idx.algonode.cloud}
      - ALGORAND_TOKEN=${ALGORAND_TOKEN:-}
      - READ_ONLY=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TRANSACTION_TIMEOUT=${TRANSACTION_TIMEOUT:-30}
      - MAX_TRANSACTION_RETRIES=${MAX_TRANSACTION_RETRIES:-3}
    volumes:
      - mcp-writer-logs:/app/logs
    networks:
      - algorand-lending
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==============================================================================
  # DATABASE SERVICES
  # ==============================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: algorand-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-lending_db}
      - POSTGRES_USER=${POSTGRES_USER:-lending_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/backups
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - algorand-lending
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lending_user} -d ${POSTGRES_DB:-lending_db}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c temp_file_limit=2GB
      -c log_min_duration_statement=1000
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: algorand-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
    volumes:
      - redis-data:/data
      - redis-logs:/var/log/redis
    networks:
      - algorand-lending
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==============================================================================
  # REVERSE PROXY & SSL
  # ==============================================================================

  # Traefik Reverse Proxy
  traefik:
    image: traefik:v2.11
    container_name: algorand-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=algorand-lending"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.caserver=${ACME_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--log.filepath=/var/log/traefik/traefik.log"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addentrypointslabels=true"
      - "--metrics.prometheus.addserviceslabels=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard (secure in production)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
      - traefik-logs:/var/log/traefik
    networks:
      - algorand-lending
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN:-lending.localhost}`)"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_AUTH:-admin:$$2y$$10$$wJshDY5RpFe6ky2zJxOq0.9X4HLH/vqYM/hLvXOfOg.9NsXJ/8Wm.}"

  # ==============================================================================
  # MONITORING SERVICES
  # ==============================================================================

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: algorand-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.external-url=http://prometheus.${DOMAIN:-lending.localhost}'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
      - prometheus-logs:/var/log/prometheus
    networks:
      - algorand-lending
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN:-lending.localhost}`)"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prometheus.middlewares=auth"

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:10.2.0
    container_name: algorand-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN:-lending.localhost}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-polystat-panel
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-logs:/var/log/grafana
    networks:
      - algorand-lending
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN:-lending.localhost}`)"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"

  # AlertManager
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: algorand-alertmanager
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://alerts.${DOMAIN:-lending.localhost}'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
      - alertmanager-logs:/var/log/alertmanager
    networks:
      - algorand-lending
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alerts.${DOMAIN:-lending.localhost}`)"
      - "traefik.http.routers.alertmanager.tls=true"
      - "traefik.http.routers.alertmanager.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alertmanager.middlewares=auth"

  # ==============================================================================
  # UTILITY SERVICES
  # ==============================================================================

  # Database Backup Service
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: algorand-postgres-backup
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-lending_db}
      - POSTGRES_USER=${POSTGRES_USER:-lending_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_EXTRA_OPTS=-Z9 --schema=public --blobs
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - postgres-backups:/backups
    networks:
      - algorand-lending
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

# ==============================================================================
# NETWORKS
# ==============================================================================

networks:
  algorand-lending:
    driver: bridge
    name: algorand-lending-network
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ==============================================================================
# VOLUMES
# ==============================================================================

volumes:
  # Database storage
  postgres-data:
    name: algorand_lending_postgres_data
  postgres-backups:
    name: algorand_lending_postgres_backups
  redis-data:
    name: algorand_lending_redis_data

  # Application logs
  api-logs:
    name: algorand_lending_api_logs
  ui-logs:
    name: algorand_lending_ui_logs
  mcp-reader-logs:
    name: algorand_lending_mcp_reader_logs
  mcp-writer-logs:
    name: algorand_lending_mcp_writer_logs
  redis-logs:
    name: algorand_lending_redis_logs

  # Reverse proxy & SSL
  traefik-letsencrypt:
    name: algorand_lending_traefik_letsencrypt
  traefik-logs:
    name: algorand_lending_traefik_logs

  # Monitoring data
  prometheus-data:
    name: algorand_lending_prometheus_data
  prometheus-logs:
    name: algorand_lending_prometheus_logs
  grafana-data:
    name: algorand_lending_grafana_data
  grafana-logs:
    name: algorand_lending_grafana_logs
  alertmanager-data:
    name: algorand_lending_alertmanager_data
  alertmanager-logs:
    name: algorand_lending_alertmanager_logs