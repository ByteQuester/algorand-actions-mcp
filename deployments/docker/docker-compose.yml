services:
  # Actions MCP Worker - Transaction building, simulation, and submission
  actions-mcp:
    build:
      context: .
      dockerfile: apps/blockchain/algorand-actions-mcp/Dockerfile
    container_name: algorand-actions-mcp
    ports:
      - "8788:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - ALGORAND_NETWORK=${ALGORAND_NETWORK:-testnet}
      - ALGORAND_ALGOD=${ALGORAND_ALGOD:-https://testnet-api.algonode.cloud}
      - ALGORAND_TOKEN=${ALGORAND_TOKEN:-}
      - READ_ONLY=${ACTIONS_READ_ONLY:-false}
    volumes:
      # Mount source code for development (comment out for production)
      - ./apps/blockchain/algorand-actions-mcp/src:/app/src:ro
      - ./packages:/app/packages:ro
    networks:
      - algorand-mcp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.actions-mcp.rule=Host(`actions.localhost`)"
      - "traefik.http.services.actions-mcp.loadbalancer.server.port=8080"

  # Remote MCP Worker - Blockchain data access and querying
  remote-mcp:
    build:
      context: .
      dockerfile: apps/blockchain/algorand-remote-mcp/Dockerfile
    container_name: algorand-remote-mcp
    ports:
      - "8002:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - ALGORAND_NETWORK=${ALGORAND_NETWORK:-testnet}
      - ALGORAND_ALGOD=${ALGORAND_ALGOD:-https://testnet-api.algonode.cloud}
      - ALGORAND_INDEXER=${ALGORAND_INDEXER:-https://testnet-idx.algonode.cloud}
      - ALGORAND_TOKEN=${ALGORAND_TOKEN:-}
      - READ_ONLY=${REMOTE_READ_ONLY:-true}
      # OAuth settings (typically not set for local dev, keeping read-only mode)
      - HCV_WORKER=${HCV_WORKER:-}
      - HCV_WORKER_URL=${HCV_WORKER_URL:-}
      - VAULT_ENTITIES=${VAULT_ENTITIES:-}
      - VAULT_OIDC_ACCESSOR=${VAULT_OIDC_ACCESSOR:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - COOKIE_ENCRYPTION_KEY=${COOKIE_ENCRYPTION_KEY:-}
    volumes:
      # Mount source code for development (comment out for production)
      - ./apps/blockchain/algorand-remote-mcp/src:/app/src:ro
      - ./packages:/app/packages:ro
    networks:
      - algorand-mcp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.remote-mcp.rule=Host(`remote.localhost`)"
      - "traefik.http.services.remote-mcp.loadbalancer.server.port=8080"

  # Optional: Traefik reverse proxy for local development
  traefik:
    image: traefik:v2.10
    container_name: algorand-mcp-proxy
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - algorand-mcp
    profiles:
      - proxy
    restart: unless-stopped

  # Optional: Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: algorand-mcp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - algorand-mcp
    profiles:
      - monitoring
    restart: unless-stopped

  # Optional: Grafana dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: algorand-mcp-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - algorand-mcp
    profiles:
      - monitoring
    restart: unless-stopped

networks:
  algorand-mcp:
    driver: bridge
    name: algorand-mcp-network

volumes:
  grafana-storage: