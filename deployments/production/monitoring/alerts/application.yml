# ==============================================================================
# APPLICATION ALERTING RULES
# ==============================================================================
# Application-specific alerts for Algorand Lending Platform
# Monitors API performance, MCP services, and business logic
# ==============================================================================

groups:
  - name: application.rules
    interval: 15s
    rules:
      # ===========================================================================
      # LENDING API ALERTS
      # ===========================================================================

      - alert: LendingAPIDown
        expr: up{job="algorand-lending-api"} == 0
        for: 30s
        labels:
          severity: critical
          category: application
          service: lending-api
        annotations:
          summary: "Lending API is down"
          description: "The Algorand Lending API is not responding to health checks."
          runbook_url: "https://docs.algorand-lending.com/runbooks/api-down"

      - alert: HighAPIErrorRate
        expr: rate(http_requests_total{job="algorand-lending-api",status=~"5.."}[5m]) / rate(http_requests_total{job="algorand-lending-api"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          category: application
          service: lending-api
        annotations:
          summary: "High API error rate"
          description: "Lending API 5xx error rate is above 5% for the last 5 minutes. Current rate: {{ $value }}%"

      - alert: CriticalAPIErrorRate
        expr: rate(http_requests_total{job="algorand-lending-api",status=~"5.."}[5m]) / rate(http_requests_total{job="algorand-lending-api"}[5m]) > 0.20
        for: 2m
        labels:
          severity: critical
          category: application
          service: lending-api
        annotations:
          summary: "Critical API error rate"
          description: "Lending API 5xx error rate is above 20% for the last 2 minutes. Current rate: {{ $value }}%"

      - alert: SlowAPIResponses
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="algorand-lending-api"}[5m])) > 2
        for: 10m
        labels:
          severity: warning
          category: application
          service: lending-api
        annotations:
          summary: "Slow API responses"
          description: "95th percentile API response time is above 2 seconds. Current: {{ $value }}s"

      - alert: HighAPIRequestRate
        expr: rate(http_requests_total{job="algorand-lending-api"}[5m]) > 100
        for: 10m
        labels:
          severity: warning
          category: application
          service: lending-api
        annotations:
          summary: "High API request rate"
          description: "API is receiving more than 100 requests per second. Current: {{ $value }} req/s"

      - alert: LowAPIRequestRate
        expr: rate(http_requests_total{job="algorand-lending-api"}[10m]) < 0.1
        for: 30m
        labels:
          severity: warning
          category: application
          service: lending-api
        annotations:
          summary: "Low API request rate"
          description: "API request rate is unusually low. This might indicate a problem with the frontend or load balancer."

      # ===========================================================================
      # MCP SERVICES ALERTS
      # ===========================================================================

      - alert: ActionsMCPDown
        expr: up{job="algorand-actions-mcp"} == 0
        for: 30s
        labels:
          severity: critical
          category: application
          service: actions-mcp
        annotations:
          summary: "Actions MCP service is down"
          description: "The Algorand Actions MCP service is not responding."
          runbook_url: "https://docs.algorand-lending.com/runbooks/mcp-down"

      - alert: RemoteMCPDown
        expr: up{job="algorand-remote-mcp"} == 0
        for: 30s
        labels:
          severity: critical
          category: application
          service: remote-mcp
        annotations:
          summary: "Remote MCP service is down"
          description: "The Algorand Remote MCP service is not responding."
          runbook_url: "https://docs.algorand-lending.com/runbooks/mcp-down"

      - alert: HighMCPErrorRate
        expr: rate(mcp_errors_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          category: application
          service: mcp
        annotations:
          summary: "High MCP error rate"
          description: "MCP services are experiencing high error rates. Current: {{ $value }} errors/s"

      - alert: MCPTransactionFailures
        expr: rate(mcp_transaction_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          category: application
          service: actions-mcp
        annotations:
          summary: "MCP transaction failures"
          description: "Actions MCP is experiencing transaction failures. Current rate: {{ $value }} failures/s"

      # ===========================================================================
      # FRONTEND ALERTS
      # ===========================================================================

      - alert: FrontendDown
        expr: up{job="algorand-adk-web"} == 0
        for: 1m
        labels:
          severity: critical
          category: application
          service: frontend
        annotations:
          summary: "Frontend service is down"
          description: "The ADK Web frontend is not responding."

      - alert: HighFrontendErrorRate
        expr: rate(http_requests_total{job="algorand-adk-web",status=~"5.."}[5m]) / rate(http_requests_total{job="algorand-adk-web"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: application
          service: frontend
        annotations:
          summary: "High frontend error rate"
          description: "Frontend 5xx error rate is above 10%. Current rate: {{ $value }}%"

      # ===========================================================================
      # BUSINESS LOGIC ALERTS
      # ===========================================================================

      - alert: HighLoanRejectionRate
        expr: rate(loan_requests_rejected_total[10m]) / rate(loan_requests_total[10m]) > 0.5
        for: 15m
        labels:
          severity: warning
          category: business
          service: lending-api
        annotations:
          summary: "High loan rejection rate"
          description: "More than 50% of loan requests are being rejected. This might indicate a problem with the lending logic or blockchain connectivity."

      - alert: NoLoanRequestsRecently
        expr: increase(loan_requests_total[30m]) == 0
        for: 30m
        labels:
          severity: warning
          category: business
          service: lending-api
        annotations:
          summary: "No loan requests received recently"
          description: "No loan requests have been received in the last 30 minutes."

      - alert: HighLoanProcessingTime
        expr: histogram_quantile(0.95, rate(loan_processing_duration_seconds_bucket[10m])) > 30
        for: 10m
        labels:
          severity: warning
          category: business
          service: lending-api
        annotations:
          summary: "High loan processing time"
          description: "95th percentile loan processing time is above 30 seconds. Current: {{ $value }}s"

      - alert: LoanProcessingStuck
        expr: loan_requests_processing > 10
        for: 30m
        labels:
          severity: critical
          category: business
          service: lending-api
        annotations:
          summary: "Loan processing appears stuck"
          description: "There are {{ $value }} loans that have been processing for more than 30 minutes."

      # ===========================================================================
      # AUTHENTICATION ALERTS
      # ===========================================================================

      - alert: HighAuthFailureRate
        expr: rate(auth_failures_total[5m]) > 2
        for: 10m
        labels:
          severity: warning
          category: security
          service: lending-api
        annotations:
          summary: "High authentication failure rate"
          description: "Authentication failure rate is above 2 failures per second. This might indicate a brute force attack."

      - alert: SuspiciousLoginActivity
        expr: rate(auth_failures_total[1m]) > 10
        for: 1m
        labels:
          severity: critical
          category: security
          service: lending-api
        annotations:
          summary: "Suspicious login activity detected"
          description: "Very high authentication failure rate detected. Possible brute force attack in progress."

      # ===========================================================================
      # RATE LIMITING ALERTS
      # ===========================================================================

      - alert: HighRateLimitTriggers
        expr: rate(rate_limit_triggered_total[5m]) > 5
        for: 10m
        labels:
          severity: warning
          category: application
          service: lending-api
        annotations:
          summary: "High rate limiting activity"
          description: "Rate limiting is being triggered frequently. Current rate: {{ $value }} triggers/s"

      - alert: RateLimitExhausted
        expr: rate_limit_remaining_requests < 10
        for: 5m
        labels:
          severity: critical
          category: application
          service: lending-api
        annotations:
          summary: "Rate limit nearly exhausted"
          description: "Rate limit bucket has fewer than 10 remaining requests."

      # ===========================================================================
      # DEPENDENCY ALERTS
      # ===========================================================================

      - alert: ExternalServiceTimeout
        expr: rate(external_service_timeouts_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: application
          service: lending-api
        annotations:
          summary: "External service timeouts"
          description: "Experiencing timeouts with external services (Algorand node, etc.). Rate: {{ $value }} timeouts/s"

      - alert: AlgorandNodeUnreachable
        expr: algorand_node_reachable == 0
        for: 2m
        labels:
          severity: critical
          category: application
          service: mcp
        annotations:
          summary: "Algorand node unreachable"
          description: "Cannot connect to Algorand node. All blockchain operations will fail."

      # ===========================================================================
      # PERFORMANCE ALERTS
      # ===========================================================================

      - alert: HighGoroutineCount
        expr: go_goroutines{job=~"algorand-.*"} > 1000
        for: 10m
        labels:
          severity: warning
          category: application
        annotations:
          summary: "High goroutine count"
          description: "Service {{ $labels.job }} has {{ $value }} goroutines running. This might indicate a resource leak."

      - alert: HighGCTime
        expr: rate(go_gc_duration_seconds_sum[5m]) / rate(go_gc_duration_seconds_count[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
          category: application
        annotations:
          summary: "High garbage collection time"
          description: "Service {{ $labels.job }} is spending significant time in garbage collection."