# ==============================================================================
# DATABASE ALERTING RULES
# ==============================================================================
# Database-specific alerts for PostgreSQL and Redis
# Monitors connection pools, query performance, and data integrity
# ==============================================================================

groups:
  - name: database.rules
    interval: 30s
    rules:
      # ===========================================================================
      # POSTGRESQL ALERTS
      # ===========================================================================

      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database is not responding to connections."
          runbook_url: "https://docs.algorand-lending.com/runbooks/postgres-down"

      - alert: PostgreSQLTooManyConnections
        expr: sum(pg_stat_activity_count) by (instance) > 80
        for: 5m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL too many connections"
          description: "PostgreSQL has {{ $value }} connections, which is getting close to the maximum."

      - alert: PostgreSQLConnectionsExhausted
        expr: sum(pg_stat_activity_count) by (instance) >= 100
        for: 1m
        labels:
          severity: critical
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL connections exhausted"
          description: "PostgreSQL connection limit has been reached ({{ $value }} connections)."

      - alert: PostgreSQLSlowQueries
        expr: rate(pg_stat_database_tup_fetched[5m]) / rate(pg_stat_database_tup_returned[5m]) > 10
        for: 10m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL slow queries detected"
          description: "PostgreSQL is experiencing slow query performance."

      - alert: PostgreSQLDeadlocks
        expr: increase(pg_stat_database_deadlocks[1h]) > 5
        for: 0m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "PostgreSQL has {{ $value }} deadlocks in the last hour."

      - alert: PostgreSQLHighTransactionTime
        expr: rate(pg_stat_database_xact_commit[5m]) + rate(pg_stat_database_xact_rollback[5m]) > 100
        for: 10m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL high transaction rate"
          description: "PostgreSQL transaction rate is very high: {{ $value }} transactions/sec."

      - alert: PostgreSQLReplicationLag
        expr: pg_replication_lag > 30
        for: 5m
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL replication lag"
          description: "PostgreSQL replica is {{ $value }} seconds behind master."

      - alert: PostgreSQLTablesBloat
        expr: pg_table_bloat_ratio > 20
        for: 1h
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL table bloat detected"
          description: "Table {{ $labels.table }} has {{ $value }}% bloat."

      - alert: PostgreSQLUnusedIndexes
        expr: pg_stat_user_indexes_idx_scan == 0 AND pg_indexes_size_bytes > 100000000
        for: 24h
        labels:
          severity: warning
          category: database
          service: postgresql
        annotations:
          summary: "PostgreSQL unused index detected"
          description: "Index {{ $labels.indexname }} on table {{ $labels.tablename }} hasn't been used and is larger than 100MB."

      # ===========================================================================
      # REDIS ALERTS
      # ===========================================================================

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          category: database
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis server is not responding."
          runbook_url: "https://docs.algorand-lending.com/runbooks/redis-down"

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: database
          service: redis
        annotations:
          summary: "Redis high memory usage"
          description: "Redis memory usage is above 80%. Current: {{ $value }}%"

      - alert: RedisCriticalMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 95
        for: 2m
        labels:
          severity: critical
          category: database
          service: redis
        annotations:
          summary: "Redis critical memory usage"
          description: "Redis memory usage is above 95%. Current: {{ $value }}%"

      - alert: RedisHighConnectionCount
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
          category: database
          service: redis
        annotations:
          summary: "Redis high connection count"
          description: "Redis has {{ $value }} connected clients."

      - alert: RedisSlowLogLength
        expr: redis_slowlog_length > 100
        for: 5m
        labels:
          severity: warning
          category: database
          service: redis
        annotations:
          summary: "Redis slow log is growing"
          description: "Redis slow log has {{ $value }} entries, indicating performance issues."

      - alert: RedisKeyspaceHitRatio
        expr: redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total) < 0.8
        for: 10m
        labels:
          severity: warning
          category: database
          service: redis
        annotations:
          summary: "Redis low cache hit ratio"
          description: "Redis keyspace hit ratio is {{ $value }}, which is below 80%."

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: database
          service: redis
        annotations:
          summary: "Redis rejecting connections"
          description: "Redis has rejected {{ $value }} connections in the last 5 minutes."

      - alert: RedisEvictedKeys
        expr: increase(redis_evicted_keys_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          category: database
          service: redis
        annotations:
          summary: "Redis evicting keys frequently"
          description: "Redis has evicted {{ $value }} keys in the last 5 minutes due to memory pressure."

      # ===========================================================================
      # CONNECTION POOL ALERTS
      # ===========================================================================

      - alert: DatabaseConnectionPoolExhausted
        expr: database_connections_in_use / database_connections_max > 0.9
        for: 2m
        labels:
          severity: critical
          category: database
          service: connection-pool
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "Database connection pool is at {{ $value }}% utilization."

      - alert: HighDatabaseConnectionWaitTime
        expr: histogram_quantile(0.95, rate(database_connection_wait_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          category: database
          service: connection-pool
        annotations:
          summary: "High database connection wait time"
          description: "95th percentile connection wait time is {{ $value }}s."

      - alert: DatabaseConnectionLeaks
        expr: database_connections_leaked_total > 0
        for: 1m
        labels:
          severity: critical
          category: database
          service: connection-pool
        annotations:
          summary: "Database connection leaks detected"
          description: "{{ $value }} database connections have been leaked and not returned to the pool."

      # ===========================================================================
      # BACKUP ALERTS
      # ===========================================================================

      - alert: DatabaseBackupFailed
        expr: time() - database_backup_last_success_timestamp > 86400
        for: 1h
        labels:
          severity: critical
          category: database
          service: backup
        annotations:
          summary: "Database backup failed"
          description: "Database backup has not succeeded in the last 24 hours."

      - alert: DatabaseBackupTooSlow
        expr: database_backup_duration_seconds > 3600
        for: 0m
        labels:
          severity: warning
          category: database
          service: backup
        annotations:
          summary: "Database backup is taking too long"
          description: "Current database backup has been running for {{ $value }}s (over 1 hour)."

      - alert: DatabaseBackupSizeAnomaly
        expr: abs(database_backup_size_bytes - database_backup_size_bytes offset 1d) / database_backup_size_bytes > 0.5
        for: 1h
        labels:
          severity: warning
          category: database
          service: backup
        annotations:
          summary: "Database backup size anomaly"
          description: "Database backup size has changed by more than 50% compared to yesterday."

      # ===========================================================================
      # DATA INTEGRITY ALERTS
      # ===========================================================================

      - alert: CorruptedLoanRecords
        expr: loan_records_corrupted_total > 0
        for: 0m
        labels:
          severity: critical
          category: database
          service: data-integrity
        annotations:
          summary: "Corrupted loan records detected"
          description: "{{ $value }} corrupted loan records have been detected in the database."

      - alert: InconsistentBalances
        expr: user_balance_inconsistencies_total > 0
        for: 5m
        labels:
          severity: critical
          category: database
          service: data-integrity
        annotations:
          summary: "User balance inconsistencies detected"
          description: "{{ $value }} user accounts have inconsistent balance calculations."

      - alert: MissingTransactionRecords
        expr: blockchain_transactions_total - database_transactions_total > 10
        for: 10m
        labels:
          severity: warning
          category: database
          service: data-integrity
        annotations:
          summary: "Missing transaction records in database"
          description: "Database is missing {{ $value }} transaction records compared to blockchain."