# ==============================================================================
# INFRASTRUCTURE ALERTING RULES
# ==============================================================================
# Critical infrastructure alerts for Algorand Lending Platform
# Monitors system resources, service availability, and performance
# ==============================================================================

groups:
  - name: infrastructure.rules
    interval: 30s
    rules:
      # ===========================================================================
      # SERVICE AVAILABILITY ALERTS
      # ===========================================================================

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "Service {{ $labels.instance }} (job: {{ $labels.job }}) has been down for more than 1 minute."
          runbook_url: "https://docs.algorand-lending.com/runbooks/service-down"

      - alert: HighServiceRestarts
        expr: increase(process_start_time_seconds[1h]) > 5
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High restart rate for {{ $labels.instance }}"
          description: "Service {{ $labels.instance }} has restarted {{ $value }} times in the last hour."

      # ===========================================================================
      # SYSTEM RESOURCE ALERTS
      # ===========================================================================

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 5 minutes. Current value: {{ $value }}%"

      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 95% for more than 2 minutes. Current value: {{ $value }}%"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 80% for more than 5 minutes. Current value: {{ $value }}%"

      - alert: CriticalMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 95
        for: 2m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 95% for more than 2 minutes. Current value: {{ $value }}%"

      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage on {{ $labels.mountpoint }} is above 80%. Current value: {{ $value }}%"

      - alert: CriticalDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes * 100 > 95
        for: 2m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Critical disk usage on {{ $labels.instance }}"
          description: "Disk usage on {{ $labels.mountpoint }} is above 95%. Current value: {{ $value }}%"

      - alert: HighNetworkErrors
        expr: increase(node_network_receive_errs_total[5m]) > 100 or increase(node_network_transmit_errs_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High network errors on {{ $labels.instance }}"
          description: "Network interface {{ $labels.device }} is experiencing high error rates."

      # ===========================================================================
      # DOCKER CONTAINER ALERTS
      # ===========================================================================

      - alert: ContainerKilled
        expr: time() - container_last_seen > 60
        for: 0m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Container {{ $labels.name }} killed"
          description: "Container {{ $labels.name }} has been killed and is not running."

      - alert: ContainerHighCPU
        expr: (sum(rate(container_cpu_usage_seconds_total[3m])) BY (container_label_com_docker_compose_service, instance) * 100) > 80
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Container high CPU usage"
          description: "Container {{ $labels.container_label_com_docker_compose_service }} CPU usage is above 80%"

      - alert: ContainerHighMemory
        expr: (sum(container_memory_usage_bytes) BY (container_label_com_docker_compose_service, instance) / sum(container_spec_memory_limit_bytes > 0) BY (container_label_com_docker_compose_service, instance) * 100) > 80
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Container high memory usage"
          description: "Container {{ $labels.container_label_com_docker_compose_service }} memory usage is above 80%"

      # ===========================================================================
      # LOAD BALANCER / REVERSE PROXY ALERTS
      # ===========================================================================

      - alert: NginxDown
        expr: nginx_up == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Nginx is down"
          description: "Nginx reverse proxy is down and not serving requests."

      - alert: HighNginxErrorRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) / rate(nginx_http_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "High Nginx error rate"
          description: "Nginx 5xx error rate is above 10% for the last 5 minutes."

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(nginx_http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High response time"
          description: "95th percentile response time is above 5 seconds."

      # ===========================================================================
      # SSL CERTIFICATE ALERTS
      # ===========================================================================

      - alert: SSLCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 7
        for: 1h
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in less than 7 days."

      - alert: SSLCertificateExpired
        expr: probe_ssl_earliest_cert_expiry - time() < 0
        for: 0m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "SSL certificate expired"
          description: "SSL certificate for {{ $labels.instance }} has expired."

      # ===========================================================================
      # BACKUP SYSTEM ALERTS
      # ===========================================================================

      - alert: BackupFailed
        expr: time() - backup_last_success_timestamp > 86400 * 2
        for: 1h
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Backup system failure"
          description: "Last successful backup was more than 2 days ago."

      - alert: BackupStorageHigh
        expr: backup_storage_used_bytes / backup_storage_total_bytes > 0.8
        for: 1h
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Backup storage usage high"
          description: "Backup storage usage is above 80%. Current: {{ $value }}%"