apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: algorand-lending
  labels:
    app: algorand-lending-platform
    component: config
data:
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "https://lending.yourdomain.com"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  ENVIRONMENT: "production"
  NODE_ENV: "production"
  LENDING_ONLY_MODE: "true"
  HIDE_GENERIC_AGENTS: "true"
  TRANSACTION_TIMEOUT: "30"
  MAX_TRANSACTION_RETRIES: "3"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: algorand-config
  namespace: algorand-lending
  labels:
    app: algorand-lending-platform
    component: blockchain
data:
  ALGORAND_NETWORK: "testnet"
  ALGORAND_ALGOD_URL: "https://testnet-api.algonode.cloud"
  ALGORAND_INDEXER_URL: "https://testnet-idx.algonode.cloud"
  ALGORAND_TOKEN: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: algorand-lending
  labels:
    app: algorand-lending-platform
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "alerts.yml"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'lending-api'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - algorand-lending
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: lending-api-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http

      - job_name: 'mcp-services'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - algorand-lending
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: (mcp-reader-service|mcp-writer-service)

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - algorand-lending
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

  alerts.yml: |
    groups:
    - name: algorand-lending
      rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "95th percentile latency is {{ $value }} seconds"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "{{ $labels.job }} has been down for more than 1 minute"

      - alert: DatabaseConnectionFailed
        expr: postgresql_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection failed"
          description: "PostgreSQL database is unreachable"

      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "Container CPU usage is above 80%"

      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Container memory usage is above 80%"
---
