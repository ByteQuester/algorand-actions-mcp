apiVersion: apps/v1
kind: Deployment
metadata:
  name: lending-api
  namespace: algorand-lending
  labels:
    app: lending-api
    component: backend
    version: v1.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: lending-api
  template:
    metadata:
      labels:
        app: lending-api
        component: backend
        version: v1.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: lending-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: lending-api
        image: algorand-lending-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        - name: ALGORAND_NETWORK
          valueFrom:
            configMapKeyRef:
              name: algorand-config
              key: ALGORAND_NETWORK
        - name: ALGORAND_ALGOD_URL
          valueFrom:
            configMapKeyRef:
              name: algorand-config
              key: ALGORAND_ALGOD_URL
        - name: ALGORAND_INDEXER_URL
          valueFrom:
            configMapKeyRef:
              name: algorand-config
              key: ALGORAND_INDEXER_URL
        - name: MCP_READER_URL
          value: "http://mcp-reader-service:8002"
        - name: MCP_WRITER_URL
          value: "http://mcp-writer-service:3001"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_URL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CORS_ORIGINS
        - name: RATE_LIMIT_ENABLED
          value: "true"
        - name: RATE_LIMIT_REQUESTS_PER_MINUTE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: RATE_LIMIT_REQUESTS_PER_MINUTE
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: logs
        emptyDir:
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - lending-api
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "app"
        operator: "Equal"
        value: "lending-api"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: lending-api-service
  namespace: algorand-lending
  labels:
    app: lending-api
    component: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8003
    protocol: TCP
    name: http
  selector:
    app: lending-api
  sessionAffinity: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lending-api
  namespace: algorand-lending
  labels:
    app: lending-api
    component: backend
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lending-api-network-policy
  namespace: algorand-lending
spec:
  podSelector:
    matchLabels:
      app: lending-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: algorand-lending
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8003
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: algorand-lending
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 8002  # MCP Reader
    - protocol: TCP
      port: 3001  # MCP Writer
  - to: []  # Allow external Algorand network access
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to: []  # Allow DNS
    ports:
    - protocol: UDP
      port: 53