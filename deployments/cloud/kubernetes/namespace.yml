apiVersion: v1
kind: Namespace
metadata:
  name: algorand-lending
  labels:
    name: algorand-lending
    app.kubernetes.io/name: algorand-lending-platform
    app.kubernetes.io/version: "1.0"
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: algorand-lending-quota
  namespace: algorand-lending
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    persistentvolumeclaims: "10"
    pods: "20"
    services: "10"
    secrets: "10"
    configmaps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: algorand-lending-limits
  namespace: algorand-lending
spec:
  limits:
  - default:
      cpu: "1"
      memory: "1Gi"
    defaultRequest:
      cpu: "200m"
      memory: "256Mi"
    type: Container
  - default:
      storage: "10Gi"
    type: PersistentVolumeClaim