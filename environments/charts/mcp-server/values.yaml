# Default values for mcp-server
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global configuration
global:
  # Image registry for all images
  imageRegistry: ghcr.io
  # Image pull secrets for private registries
  imagePullSecrets: []
  # Storage class for persistent volumes
  storageClass: ""

# Common configuration for both workers
common:
  # Labels to be added to all resources
  labels: {}
  # Annotations to be added to all resources
  annotations: {}

# Worker-specific configuration
worker:
  # Worker type: "actions" or "remote"
  type: ""
  # Worker name (will be used in resource names)
  name: ""

# Deployment configuration
replicaCount: 1

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - mcp-server
        topologyKey: kubernetes.io/hostname

# Liveness and Readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Environment configuration
env:
  NODE_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"

# ConfigMap data (non-sensitive configuration)
configMap:
  # Algorand network configuration
  ALGORAND_NETWORK: "testnet"
  ALGORAND_ALGOD: ""
  ALGORAND_INDEXER: ""
  # Application settings
  READ_ONLY: "false"
  ITEMS_PER_PAGE: "10"
  MAX_REQUEST_SIZE: "10mb"
  REQUEST_TIMEOUT: "30000"
  # Monitoring
  ENABLE_METRICS: "true"
  METRICS_PORT: "8080"

# Secret data (sensitive configuration)
# These values should be provided via --set or values file
secret:
  # API tokens
  ALGORAND_TOKEN: ""
  # OAuth settings (Remote MCP only)
  HCV_WORKER: ""
  HCV_WORKER_URL: ""
  VAULT_ENTITIES: ""
  VAULT_OIDC_ACCESSOR: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  COOKIE_ENCRYPTION_KEY: ""

# Volume mounts
volumeMounts: []
#  - name: cache
#    mountPath: /app/cache

volumes: []
#  - name: cache
#    emptyDir: {}

# Service Monitor for Prometheus Operator
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  labels: {}
  honorLabels: true
  relabelings: []

# Network Policy
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
    - from:
      - namespaceSelector:
          matchLabels:
            name: prometheus
  egress:
    - to:
      - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

# Priority Class
priorityClassName: ""

# Topology Spread Constraints
topologySpreadConstraints: []
#  - maxSkew: 1
#    topologyKey: zone
#    whenUnsatisfiable: DoNotSchedule
#    labelSelector:
#      matchLabels:
#        app.kubernetes.io/name: mcp-server

# Pod Management Policy for StatefulSet (if needed)
podManagementPolicy: Parallel

# Update Strategy
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

# Session Affinity
sessionAffinity: None

# Termination Grace Period
terminationGracePeriodSeconds: 30

# DNS Policy
dnsPolicy: ClusterFirst

# Host Network
hostNetwork: false

# Restart Policy
restartPolicy: Always

# Scheduler Name
schedulerName: default-scheduler

# Enable startup probe for slow starting containers
startupProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# Extra containers to be added to the pod
extraContainers: []

# Extra init containers to be added to the pod
extraInitContainers: []

# Extra environment variables
extraEnvVars: []

# Extra environment variables from ConfigMaps or Secrets
extraEnvFrom: []

# Extra ports to expose
extraPorts: []

# Extra volume mounts
extraVolumeMounts: []

# Extra volumes
extraVolumes: []