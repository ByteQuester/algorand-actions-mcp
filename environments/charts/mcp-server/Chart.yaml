apiVersion: v2
name: mcp-server
description: Helm chart for Algorand MCP Workers (Actions and Remote)
type: application
version: 1.0.0
appVersion: "0.1.1"

keywords:
  - algorand
  - mcp
  - blockchain
  - kubernetes

maintainers:
  - name: Algorand MCP Team
    email: support@algorand-mcp.io

sources:
  - https://github.com/bytequester/algorand-showcase

home: https://github.com/bytequester/algorand-showcase

icon: https://avatars.githubusercontent.com/u/7978079

annotations:
  # Chart documentation
  "artifacthub.io/readme": |
    # MCP Server Helm Chart

    This chart deploys Algorand MCP Workers (Actions and Remote) on Kubernetes.

    ## Features
    - Multi-environment support (dev, staging, prod)
    - Auto-scaling with HPA
    - Health checks and readiness probes
    - ConfigMap and Secret management
    - Ingress with TLS support
    - Prometheus metrics integration

  # Artifact Hub annotations
  "artifacthub.io/category": blockchain
  "artifacthub.io/license": MIT
  "artifacthub.io/signKey": |
    fingerprint: <key-fingerprint>
    url: https://keybase.io/algorand

  # Security scanning
  "artifacthub.io/containsSecurityUpdates": "false"
  "artifacthub.io/prerelease": "false"

  # Recommendations
  "artifacthub.io/recommendations": |
    - url: https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
      type: monitoring