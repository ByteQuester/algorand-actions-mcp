apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-server.fullname" . }}-secret
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
  {{- with .Values.common.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $key, $value := .Values.secret }}
  {{- if $value }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}

  # Worker-specific secrets
  {{- if eq .Values.worker.type "actions" }}
  # Actions MCP Worker secrets (if any additional ones are needed)
  {{- else if eq .Values.worker.type "remote" }}
  # Remote MCP Worker OAuth secrets are already included above
  {{- end }}