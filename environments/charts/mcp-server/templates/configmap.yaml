apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-server.fullname" . }}-config
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
  {{- with .Values.common.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- range $key, $value := .Values.configMap }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  # Worker-specific configuration
  WORKER_TYPE: {{ .Values.worker.type | quote }}
  WORKER_NAME: {{ .Values.worker.name | quote }}

  # Service discovery
  SERVICE_NAME: {{ include "mcp-server.fullname" . | quote }}
  SERVICE_PORT: {{ .Values.service.port | quote }}

  # Health check configuration
  HEALTH_CHECK_PATH: "/health"
  METRICS_PATH: "/metrics"

  # Kubernetes metadata
  K8S_NAMESPACE: {{ .Release.Namespace | quote }}
  K8S_POD_NAME: "$(POD_NAME)"
  K8S_NODE_NAME: "$(NODE_NAME)"

  # Additional worker-specific configs
  {{- if eq .Values.worker.type "actions" }}
  # Actions MCP Worker specific configs
  TRANSACTION_TIMEOUT: "30000"
  MAX_TRANSACTION_SIZE: "1MB"
  SIMULATION_TIMEOUT: "10000"
  {{- else if eq .Values.worker.type "remote" }}
  # Remote MCP Worker specific configs
  QUERY_TIMEOUT: "30000"
  MAX_QUERY_LIMIT: "1000"
  CACHE_TTL: "300"
  {{- end }}

  # Logging configuration
  LOG_FORMAT: "json"
  LOG_TIMESTAMP: "true"

  # Performance tuning
  NODE_OPTIONS: "--max-old-space-size=256"
  UV_THREADPOOL_SIZE: "4"