# Production environment values for Actions MCP Worker
# High-availability, secure, and performance-optimized configuration

# Worker identification
worker:
  type: "actions"
  name: "actions-mcp-prod"

# Production image settings (pinned to specific versions)
image:
  repository: "algorand-actions-mcp"
  tag: "1.0.0"  # Always use specific version tags in production
  pullPolicy: IfNotPresent

# High availability with 3+ replicas
replicaCount: 3

# Production environment variables
env:
  NODE_ENV: "production"
  LOG_LEVEL: "warn"
  PORT: "8080"

# Production-specific configuration
configMap:
  ALGORAND_NETWORK: "mainnet"  # Production uses mainnet
  ALGORAND_ALGOD: ""  # Use dedicated production Algod URL
  READ_ONLY: "false"
  ENABLE_METRICS: "true"
  LOG_FORMAT: "json"
  CORS_ENABLED: "true"
  CORS_ORIGIN: "https://algorand-mcp.io,https://app.algorand-mcp.io"
  REQUEST_TIMEOUT: "30000"
  MAX_REQUEST_SIZE: "2mb"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "50"
  RATE_LIMIT_WINDOW: "900000"  # 15 minutes
  CIRCUIT_BREAKER_ENABLED: "true"
  CIRCUIT_BREAKER_THRESHOLD: "10"
  CACHE_ENABLED: "true"
  CACHE_TTL: "300"

# Production secrets (managed via external secret operator)
secret:
  ALGORAND_TOKEN: ""  # Set via external secret management

# Production resource allocation with strict limits
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

# Aggressive autoscaling for production load
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 25
        periodSeconds: 120

# Pod disruption budget for production availability
podDisruptionBudget:
  enabled: true
  minAvailable: 2  # Ensure at least 2 pods always available

# Production ingress with TLS and security
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "50"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRule REQUEST_HEADERS:Content-Type "!@beginsWith application/json" "id:1001,phase:1,block"
  hosts:
    - host: actions-mcp.algorand-mcp.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: actions-mcp-prod-tls
      hosts:
        - actions-mcp.algorand-mcp.io

# Production service configuration
service:
  type: ClusterIP
  port: 80
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"

# Strict probes for production
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 45
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

# Startup probe for production
startupProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 15

# Production annotations with security and compliance
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"
  environment: "production"
  security.policy: "strict"
  compliance.required: "true"
  fluentd.active: "true"

# Production-specific labels
common:
  labels:
    environment: production
    team: algorand-mcp
    version: prod
    monitoring: enabled
    security: strict
    criticality: high
  annotations:
    deployment.kubernetes.io/revision: "1"
    scheduler.alpha.kubernetes.io/preferred-max-skew: "1"

# Strict network policy for production security
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
    - from:
      - namespaceSelector:
          matchLabels:
            name: monitoring
    - from:
      - namespaceSelector:
          matchLabels:
            name: logging
  egress:
    # Restrict egress to known endpoints
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to: []  # Algorand mainnet API
      ports:
        - protocol: TCP
          port: 443

# Enable ServiceMonitor for production metrics
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
  labels:
    environment: production
    team: algorand-mcp
  honorLabels: true

# High priority class for production workloads
priorityClassName: "system-cluster-critical"

# Production affinity for high availability and performance
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: environment
          operator: In
          values:
          - production
        - key: instance-type
          operator: In
          values:
          - c5.large
          - c5.xlarge
          - m5.large
          - m5.xlarge
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - mcp-server
        - key: worker.mcp/type
          operator: In
          values:
          - actions
      topologyKey: kubernetes.io/hostname
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - mcp-server
        topologyKey: topology.kubernetes.io/zone

# Production node selector
nodeSelector:
  environment: production
  workload-type: stateless

# Tolerations for production nodes
tolerations:
  - key: "production-only"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

# Extra environment variables for production observability
extraEnvVars:
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP

# Production-specific volumes with performance optimization
volumes:
  - name: logs
    emptyDir:
      sizeLimit: 2Gi
      medium: Memory  # In-memory for performance
  - name: metrics
    emptyDir:
      sizeLimit: 500Mi
  - name: cache
    emptyDir:
      sizeLimit: 1Gi
  - name: tmp
    emptyDir:
      sizeLimit: 500Mi

volumeMounts:
  - name: logs
    mountPath: /app/logs
  - name: metrics
    mountPath: /app/metrics
  - name: cache
    mountPath: /app/cache
  - name: tmp
    mountPath: /tmp

# Production rolling update strategy
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 2

# Topology spread constraints for production
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: mcp-server
        worker.mcp/type: actions
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: mcp-server

# Service account with production IAM roles
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/prod-actions-mcp-role"
    iam.gke.io/gcp-service-account: "actions-mcp-prod@project.iam.gserviceaccount.com"

# Security context with strict settings
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# Production termination grace period
terminationGracePeriodSeconds: 60