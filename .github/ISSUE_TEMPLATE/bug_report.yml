name: 🐛 Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide as much detail as possible to help us resolve the issue quickly.

  - type: checkboxes
    id: terms
    attributes:
      label: Prerequisites
      description: Please confirm the following before submitting a bug report
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported yet
          required: true
        - label: I am using the latest version of Algorand MCP Workers
          required: true
        - label: I have read the documentation and troubleshooting guide
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which component is experiencing the bug?
      options:
        - Actions MCP Worker (Transaction Operations)
        - Remote MCP Worker (Blockchain Data Access)
        - Shared Packages (mcp-core, algorand-clients, etc.)
        - Kubernetes Deployment
        - Docker Compose
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where are you running the MCP workers?
      options:
        - Local Development (Docker)
        - Cloudflare Workers
        - Kubernetes (self-hosted)
        - Kubernetes (cloud provider)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Algorand MCP Workers are you using?
      placeholder: "e.g., v1.2.0, commit hash, or branch name"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe what happened and what you expected to happen
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Run command '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please copy and paste any relevant log output
      placeholder: |
        Paste logs here. This will be automatically formatted as code.

        For Docker: docker-compose logs [service-name]
        For Kubernetes: kubectl logs [pod-name]
        For local development: check console output
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant configuration details (remove sensitive information)
      placeholder: |
        Environment variables, docker-compose.yml sections, Kubernetes manifests, etc.
        Remember to redact sensitive information like API keys!
      render: yaml

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: What version of Node.js are you using? (run `node --version`)
      placeholder: "e.g., v18.17.0"

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      placeholder: "e.g., macOS 13.4, Windows 11, Ubuntu 22.04"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: |
        - Screenshots (if applicable)
        - Network configuration details
        - Related issues or PRs
        - Workarounds you've tried
        - Any other relevant information

  - type: checkboxes
    id: network
    attributes:
      label: Algorand Network
      description: Which Algorand network are you working with?
      options:
        - label: Testnet
        - label: Mainnet
        - label: Local development network
        - label: Custom network